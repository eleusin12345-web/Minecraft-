        function getMaterial(hex, isGrass=false, isWater=false, isWorkbench=false) {
            if (isWater) return new THREE.MeshStandardMaterial({color: hex, transparent: true, opacity: 0.5, depthWrite: false});
            if (isWorkbench) return [ // Стороны верстака
                new THREE.MeshStandardMaterial({color: 0x5c3a21}), new THREE.MeshStandardMaterial({color: 0x5c3a21}),
                new THREE.MeshStandardMaterial({color: 0x8b5a2b}), new THREE.MeshStandardMaterial({color: 0x5c3a21}),
                new THREE.MeshStandardMaterial({color: 0x5c3a21}), new THREE.MeshStandardMaterial({color: 0x5c3a21})
            ];
            if (isGrass) return [
                new THREE.MeshStandardMaterial({color: 0x7a5c3d, roughness: 1}), new THREE.MeshStandardMaterial({color: 0x7a5c3d, roughness: 1}),
                new THREE.MeshStandardMaterial({color: 0x559c3f, roughness: 1}), new THREE.MeshStandardMaterial({color: 0x7a5c3d, roughness: 1}),
                new THREE.MeshStandardMaterial({color: 0x7a5c3d, roughness: 1}), new THREE.MeshStandardMaterial({color: 0x7a5c3d, roughness: 1})
            ];
            return new THREE.MeshStandardMaterial({color: hex, roughness: 0.9});
        }

        function initBlocks() {
            const blockGeo = new THREE.BoxGeometry(1, 1, 1);
            const mats = { 
                1: getMaterial(0xffffff, true), 2: getMaterial(0x7a5c3d), 3: getMaterial(0x888888), 
                4: getMaterial(0x5c4033), 5: getMaterial(0x3a7a3a), 6: getMaterial(0xcda26f), 
                7: getMaterial(0x3498db, false, true), 8: getMaterial(0x777777), 9: getMaterial(0xffffff), 
                10: getMaterial(0x666666), 11: getMaterial(0x0, false, false, true), 
                12: getMaterial(0x5c4033), // Дверь
                15: getMaterial(0x999999) // Железная руда
            };
            for(let i in mats) {
                let type = parseInt(i);
                let imesh = new THREE.InstancedMesh(blockGeo, mats[type], MAX_BLOCKS);
                imesh.count = 0; imesh.castShadow = (type!==7 && type!==9); imesh.receiveShadow = true;
                scene.add(imesh); instancedMeshes[type] = imesh; blockIndexToKey[type] = [];
            }
        }

        function addBlock(x, y, z, type, triggerNet = false) {
            if (!instancedMeshes[type]) return; 
            let key = `${x},${y},${z}`; if (blockData.has(key)) return;
            let mesh = instancedMeshes[type], index = mesh.count; if (index >= MAX_BLOCKS) return;
            dummy.position.set(x, y, z); dummy.updateMatrix();
            mesh.setMatrixAt(index, dummy.matrix); mesh.instanceMatrix.needsUpdate = true; mesh.count++;
            blockData.set(key, {type: type, index: index}); blockIndexToKey[type][index] = key;
            
            let cx = Math.floor(x/CHUNK_SIZE), cz = Math.floor(z/CHUNK_SIZE), cKey = `${cx},${cz}`;
            if(!chunkBlocks.has(cKey)) chunkBlocks.set(cKey, []); chunkBlocks.get(cKey).push(key);

            if (triggerNet) { worldMods[key] = { action: 'place', type: type }; sendNetData({ type: 'block', action: 'place', x, y, z, blockType: type }); }
        }

        function removeBlock(x, y, z, triggerNet = false) {
            let key = `${x},${y},${z}`; let block = blockData.get(key); if (!block) return null;
            let type = block.type, index = block.index;
            let mesh = instancedMeshes[type], lastIndex = mesh.count - 1;
            if (index !== lastIndex) {
                let lastMatrix = new THREE.Matrix4(); mesh.getMatrixAt(lastIndex, lastMatrix);
                mesh.setMatrixAt(index, lastMatrix); let lastKey = blockIndexToKey[type][lastIndex];
                blockData.get(lastKey).index = index; blockIndexToKey[type][index] = lastKey;
            }
            mesh.count--; mesh.instanceMatrix.needsUpdate = true; blockData.delete(key);
            
            if (triggerNet) { worldMods[key] = { action: 'break' }; sendNetData({ type: 'block', action: 'break', x, y, z }); }
            
            // Логика дропов
            if (type === 3) return 8; // Камень -> Булыжник
            if (type === 15) return 110; // Железная руда -> Железный слиток (Аркадно)
            if (type === 5) return Math.random() < 0.1 ? 109 : 0; // Листва -> Яблоко
            
            return type;
        }

        // ==========================================
        // ГЕНЕРАЦИЯ
        // ==========================================
        function spawnParticles(x, y, z, colorHex) {
            if(!colorHex) return;
            let mat = new THREE.MeshBasicMaterial({color: colorHex});
            let geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
            for(let i=0; i<6; i++) {
                let p = new THREE.Mesh(geo, mat);
                p.position.set(x + (Math.random()-0.5)*0.5, y + (Math.random()-0.5)*0.5, z + (Math.random()-0.5)*0.5);
                scene.add(p);
                particles.push({mesh: p, vx: (Math.random()-0.5)*4, vy: Math.random()*3+2, vz: (Math.random()-0.5)*4, life: 1.0});
            }
        }

        function spawnTree(x, y, z) {
            for(let i=0; i<4; i++) addBlock(x, y+i, z, 4); 
            for(let dx=-2; dx<=2; dx++) for(let dz=-2; dz<=2; dz++) for(let dy=3; dy<=5; dy++) 
                if (Math.abs(dx)+Math.abs(dz) < 4) addBlock(x+dx, y+dy, z+dz, 5); 
        }

        function generateChunk(cx, cz) {
            let key = `${cx},${cz}`; if (chunks.has(key)) return; chunks.set(key, true);
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    let wx = cx * CHUNK_SIZE + x, wz = cz * CHUNK_SIZE + z;
                    let h = Math.floor(simplex.noise2D(wx / 40, wz / 40) * 8) + 15; 
                    if (Math.random() < 0.05 && simplex.noise2D(wx/20, wz/20) > 0.6) addBlock(wx, 40, wz, 9);
                    
                    for (let y = 0; y <= Math.max(h, WATER_LEVEL); y++) {
                        let bKey = `${wx},${y},${wz}`;
                        if (worldMods[bKey] && worldMods[bKey].action === 'break') continue;
                        if (worldMods[bKey] && worldMods[bKey].action === 'place') { addBlock(wx, y, wz, worldMods[bKey].type); continue; }
                        if (y < h - 2 && y > 2 && simplex3D.noise3D(wx/15, y/15, wz/15) > 0.4) continue; 
                        let type = 3; 
                        if (y === h && y >= WATER_LEVEL) type = 1; else if (y < h && y > h - 3) type = 2; 
                        else if (y > h && y <= WATER_LEVEL) type = 7; else if (y < h - 3 && Math.random() < 0.03) type = 8; 
                        
                        // Железная руда под землей
                        if (type === 3 && y < h - 5 && Math.random() < 0.03) type = 15;
                        
                        addBlock(wx, y, wz, type);
                    }
                    if (h >= WATER_LEVEL && Math.random() < 0.01 && !worldMods[`${wx},${h+1},${wz}`]) spawnTree(wx, h+1, wz);
                    if (isHost && h >= WATER_LEVEL && Math.random() < 0.005 && mobs.length < 20) spawnMob(wx, h+1, wz, Math.random() > 0.5 ? 1 : 2);
                }
            }
        }

        function updateChunks(forceSync = false) {
            let px = Math.floor(camera.position.x / CHUNK_SIZE), pz = Math.floor(camera.position.z / CHUNK_SIZE);
            for (let cx = px - VIEW_DISTANCE; cx <= px + VIEW_DISTANCE; cx++) {
                for (let cz = pz - VIEW_DISTANCE; cz <= pz + VIEW_DISTANCE; cz++) {
                    if (!chunks.has(`${cx},${cz}`) && !chunkQueue.some(q => q.cx===cx && q.cz===cz)) {
                        if (forceSync) generateChunk(cx, cz); else chunkQueue.push({cx, cz});
                    }
                }
            }
            for (let [cKey, bArr] of chunkBlocks.entries()) {
                let [cx, cz] = cKey.split(',').map(Number);
                if (Math.abs(cx - px) > VIEW_DISTANCE + 1 || Math.abs(cz - pz) > VIEW_DISTANCE + 1) {
                    bArr.forEach(bKey => { let [bx, by, bz] = bKey.split(',').map(Number); removeBlock(bx, by, bz, false); });
                    chunkBlocks.delete(cKey); chunks.delete(cKey);
                }
            }
        }

        // ДРОПЫ, МОБЫ И ЧАТ

        function spawnDrop(x, y, z, id, count=1) {
            if (!id || id===7 || id===9) return; 
            let color = 0xffffff;
            if(id===1) color=0x559c3f; if(id===2) color=0x7a5c3d; if(id===3) color=0x888888;
            if(id===4||id===12) color=0x5c4033; if(id===6) color=0xcda26f; if(id===8||id===15) color=0x777777;
            if(id===10) color=0x666666; if(id===102) color=0xffaaaa; if(id===103) color=0xeeeeee; if(id===109) color=0xff3333;
            if(id===11) color=0x8b5a2b;
            
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({color: color, roughness:0.8}));
            mesh.position.set(x, y, z); mesh.castShadow = true; scene.add(mesh);
            drops.push({ mesh: mesh, id: id, count: count, ry: 0 });
        }

        function spawnMob(x, y, z, type=1) { 
            let color = type === 1 ? 0xeeeeee : 0xffaadd;
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({color: color}));
            mesh.position.set(x, y, z); mesh.castShadow = true; scene.add(mesh);
            let mob = { id: Math.random().toString(36).substr(2, 9), mesh: mesh, type: type, vx: 0, vy: 0, vz: 0, hp: 5, rx: x, ry: y, rz: z, nextMove: 0 };
            mobs.push(mob);
            if(isHost) sendNetData({ type: 'mob_spawn', mob: { id: mob.id, x, y, z, type } });
        }
        function updateMobs() { 
            let now = performance.now();
            for(let i = mobs.length - 1; i >= 0; i--) {
                let mob = mobs[i];
                if (now > mob.nextMove) {
                    let angle = Math.random() * Math.PI * 2, speed = Math.random() > 0.4 ? 1.5 : 0;
                    mob.vx = Math.cos(angle) * speed; mob.vz = Math.sin(angle) * speed;
                    if(Math.random() > 0.7 && blockData.has(`${Math.round(mob.rx)},${Math.round(mob.ry-1)},${Math.round(mob.rz)}`)) mob.vy = 5;
                    mob.nextMove = now + 1000 + Math.random() * 2000;
                }
            }
        }

        function renderInventory() {
            const drawSlot = (el, item) => {
                if(item) {
                    let cCls = (item.id>100 && item.id<111 && item.id!==102 && item.id!==103 && item.id!==109) ? 'icon-'+item.id : `icon-${item.id}`;
                    el.innerHTML = `<div class="item-icon ${cCls}"></div><div class="item-count">${item.count>1?item.count:''}</div>`;
                } else el.innerHTML = '';
            };
            document.querySelectorAll('.inv-slot').forEach(el => {
                let type = el.dataset.type, idx = parseInt(el.dataset.idx);
                if(type === 'main') drawSlot(el, inventory[idx]); if(type === 'hotbar') drawSlot(el, hotbar[idx]);
                if(type === 'craft') drawSlot(el, craftGrid[idx]); if(type === 'craftOut') drawSlot(el, craftResult);
            });
            for(let i=0; i<9; i++) drawSlot(document.getElementById(`hud-slot-${i}`), hotbar[i]);

            let cursorEl = document.getElementById('cursor-item');
            if(cursorItem) {
                cursorEl.style.display = 'block'; document.getElementById('cursor-icon').className = `item-icon icon-${cursorItem.id}`;
                document.getElementById('cursor-count').innerText = cursorItem.count > 1 ? cursorItem.count : '';
            } else cursorEl.style.display = 'none';
        }

        function getCraftString(arr, cols) {
            let minX = cols, maxX = -1, minY = cols, maxY = -1;
            for(let i=0; i<arr.length; i++) {
                if(arr[i]) {
                    let x = i % cols, y = Math.floor(i / cols);
                    if(x < minX) minX = x; if(x > maxX) maxX = x;
                    if(y < minY) minY = y; if(y > maxY) maxY = y;
                }
            }
            if(maxX === -1) return {str: "", w: 0, h: 0, minX, maxX, minY, maxY};
            let res = [];
            for(let y = minY; y <= maxY; y++) {
                for(let x = minX; x <= maxX; x++) res.push(arr[y*cols + x] ? arr[y*cols + x].id : 0);
                res.push('|');
            }
            return { str: res.join(','), w: maxX-minX+1, h: maxY-minY+1, minX, maxX, minY, maxY };
        }

        function checkCrafting() {
            craftResult = null;
            let p = getCraftString(craftGrid, 3);
            if(p.str === "") return;
            if(currentCraftMode === 'inv' && (p.w > 2 || p.h > 2)) return; // Слишком большое для 2x2
            
            for (let r of RECIPES) {
                if (r.in === p.str) { craftResult = { id: r.out.id, count: r.out.count }; break; }
            }
        }

        function handleInvClick(e, slotEl) {
            let type = slotEl.dataset.type, idx = parseInt(slotEl.dataset.idx);
            let targetArr = type==='main' ? inventory : (type==='hotbar' ? hotbar : (type==='craft' ? craftGrid : null));
            let currentMode = (e.button === 2) ? 'half' : invMode;
            
            if (type === 'craftOut' && craftResult) {
                if (!cursorItem || (cursorItem.id === craftResult.id && cursorItem.count + craftResult.count <= 64)) {
                    playSound('step');
                    if(!cursorItem) cursorItem = { id: craftResult.id, count: craftResult.count }; else cursorItem.count += craftResult.count;
                    
                    let p = getCraftString(craftGrid, 3);
                    for(let y = p.minY; y <= p.maxY; y++) {
                        for(let x = p.minX; x <= p.maxX; x++) {
                            let i = y*3 + x;
                            if(craftGrid[i]) { craftGrid[i].count--; if(craftGrid[i].count<=0) craftGrid[i]=null; }
                        }
                    }
                    checkCrafting(); renderInventory();
                } return;
            }
            if (!targetArr) return;
            let clickedItem = targetArr[idx];

            if (cursorItem) {
                if (!clickedItem) {
                    if (currentMode === 'one') { targetArr[idx] = { id: cursorItem.id, count: 1 }; cursorItem.count--; if(cursorItem.count <= 0) cursorItem = null; }
                    else { targetArr[idx] = cursorItem; cursorItem = null; }
                } else if (clickedItem.id === cursorItem.id) {
                    if (currentMode === 'one') { if(clickedItem.count < 64) { clickedItem.count++; cursorItem.count--; if(cursorItem.count<=0) cursorItem = null; } }
                    else { let space = 64 - clickedItem.count, toAdd = Math.min(space, cursorItem.count); clickedItem.count += toAdd; cursorItem.count -= toAdd; if(cursorItem.count <= 0) cursorItem = null; }
                } else { if(currentMode === 'all') { targetArr[idx] = cursorItem; cursorItem = clickedItem; } }
            } else if (clickedItem) {
                if (currentMode === 'half') { let half = Math.ceil(clickedItem.count / 2); cursorItem = { id: clickedItem.id, count: half }; clickedItem.count -= half; if(clickedItem.count <= 0) targetArr[idx] = null; }
                else if (currentMode === 'one') { cursorItem = { id: clickedItem.id, count: 1 }; clickedItem.count--; if(clickedItem.count <= 0) targetArr[idx] = null; }
                else { cursorItem = clickedItem; targetArr[idx] = null; }
            }
            if(type === 'craft') checkCrafting(); renderInventory();
        }

        function selectHotbarSlot(idx) { activeHotbarSlot = idx; for(let i=0; i<9; i++) document.getElementById(`hud-slot-${i}`).classList.remove('active'); document.getElementById(`hud-slot-${idx}`).classList.add('active'); handAnim = 1.0; }
        
        function giveItem(id, count) {
            playSound('step');
            for(let i=0; i<HOTBAR_SIZE; i++) { if(hotbar[i] && hotbar[i].id === id && hotbar[i].count < 64) { let s = 64 - hotbar[i].count, add = Math.min(s, count); hotbar[i].count += add; count -= add; if(count<=0){ renderInventory(); return;} } }
            for(let i=0; i<INV_SIZE; i++) { if(inventory[i] && inventory[i].id === id && inventory[i].count < 64) { let s = 64 - inventory[i].count, add = Math.min(s, count); inventory[i].count += add; count -= add; if(count<=0){ renderInventory(); return;} } }
            for(let i=0; i<HOTBAR_SIZE; i++) { if(!hotbar[i]) { hotbar[i] = {id, count}; renderInventory(); return; } }
            for(let i=0; i<INV_SIZE; i++) { if(!inventory[i]) { inventory[i] = {id, count}; renderInventory(); return; } }
        }

        function getCollisions(pos) {
            let minX = Math.round(pos.x - 0.25), maxX = Math.round(pos.x + 0.25), minY = Math.round(pos.y - 1.6), maxY = Math.round(pos.y + 0.1), minZ = Math.round(pos.z - 0.25), maxZ = Math.round(pos.z + 0.25);
            inWater = false;
            for (let x = minX; x <= maxX; x++) for (let y = minY; y <= maxY; y++) for (let z = minZ; z <= maxZ; z++) {
                let b = blockData.get(`${x},${y},${z}`);
                if (b) { if(b.type === 7) inWater = true; else if(b.type !== 9) return true; }
            }
            return false;
        }

        function getRaycastHit() {
            let pos = camera.position.clone(), dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.normalize();

                const joyBase = document.getElementById('joystick-base'), joyKnob = document.getElementById('joystick-knob');

        function createNameTag(name) {
            let canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;

        // ==========================================
        // ИГРОВОЙ ЦИКЛ (АНИМАЦИИ)

        let stepTimer = 0;
        function animate() {
            requestAnimationFrame(animate);
            let chunksProcessed = 0; while(chunkQueue.length > 0 && chunksProcessed < 2) { let chunk = chunkQueue.shift(); generateChunk(chunk.cx, chunk.cz); chunksProcessed++; }

            const time = performance.now(); let delta = Math.min((time - prevTime) / 1000, 0.05); 
            
            // Замедленный ДЕНЬ И НОЧЬ
            dayTime += delta * 0.002; 
            let sunAng = dayTime % (Math.PI*2);
            let intensity = Math.max(0.1, Math.sin(sunAng));
            
            if (camera && dirLight) {
                dirLight.position.set(Math.cos(sunAng)*40 + camera.position.x, Math.sin(sunAng)*40 + camera.position.y, Math.sin(sunAng)*10 + camera.position.z);
                dirLight.target.position.copy(camera.position); dirLight.target.updateMatrixWorld();
                dirLight.intensity = intensity * 1.5; ambientLight.intensity = 0.2 + intensity * 0.3;
                let sr = Math.floor(135*intensity), sg = Math.floor(206*intensity), sb = Math.floor(235*intensity + 20*(1-intensity));
                let skyColor = new THREE.Color(`rgb(${sr},${sg},${sb})`); scene.background = skyColor; scene.fog.color = skyColor;
            }

            for(let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i]; d.ry += delta * 2; d.mesh.rotation.y = d.ry; d.mesh.position.y += Math.sin(time*0.005) * 0.005; 
                if(camera.position.distanceTo(d.mesh.position) < 2.5) { giveItem(d.id, d.count); scene.remove(d.mesh); drops.splice(i, 1); }
            }
            
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.life -= delta;
                if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); continue; }
                p.vy -= 9.8 * delta; p.mesh.position.set(p.mesh.position.x + p.vx*delta, p.mesh.position.y + p.vy*delta, p.mesh.position.z + p.vz*delta);
            }

            for(let i = mobs.length - 1; i >= 0; i--) {
                let m = mobs[i]; m.vy -= 9.8 * delta; m.rx += m.vx * delta; m.ry += m.vy * delta; m.rz += m.vz * delta;
                if(blockData.has(`${Math.round(m.rx)},${Math.round(m.ry-1)},${Math.round(m.rz)}`)) { m.ry = Math.round(m.ry); m.vy = 0; }
                m.mesh.position.set(m.rx, m.ry, m.rz);
            }

            if ((isPointerLocked || isMobile) && !isDead && !isInvOpen) {
                // Обводка блока
                let hit = getRaycastHit();
                if (hit && hit.type === 'block') {
                    blockOutline.position.set(hit.bx, hit.by, hit.bz);
                    blockOutline.visible = true;
                } else {
                    blockOutline.visible = false;
                }

                if (handAnim > 0) { handAnim -= delta * 5; handGroup.rotation.x = Math.sin(handAnim * Math.PI) * -0.6; } else { handGroup.rotation.x = 0; }

                let pBar = document.getElementById('break-progress-container'), pFill = document.getElementById('break-progress-bar');
                if (isMining && hit && hit.type === 'block') {
                    if (miningBlock !== hit.key) { miningBlock = hit.key; mineProgress = 0; } 
                    else {
                        pBar.style.display = 'block';
                        let toolId = hotbar[activeHotbarSlot] ? hotbar[activeHotbarSlot].id : 0;
                        mineProgress += delta * getMineSpeed(hit.blockType, toolId);
                        pFill.style.width = Math.min(mineProgress * 100, 100) + '%';
                        if (mineProgress >= 1) {
                            playSound('break'); spawnParticles(hit.bx, hit.by, hit.bz, blockColors[hit.blockType]);
                            let droppedType = removeBlock(hit.bx, hit.by, hit.bz, true); spawnDrop(hit.bx, hit.by, hit.bz, droppedType);
                            miningBlock = null; mineProgress = 0; pBar.style.display = 'none'; handAnim = 1.0;
                        }
                    }
                } else { miningBlock = null; mineProgress = 0; pBar.style.display = 'none'; }

                // Физика и движение
                fallVelocityTracker = velocity.y;
                let drag = inWater ? 4.0 : 12.0, grav = inWater ? 4.0 : 35.0; 
                velocity.x -= velocity.x * drag * delta; velocity.z -= velocity.z * drag * delta; velocity.y -= grav * delta; 

                let dir = new THREE.Vector3(moveState.right, 0, -moveState.forward);
                dir.applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();

                let isMoving = (moveState.forward !== 0 || moveState.right !== 0);
                
                // Система голода и бега
                if (isSprinting && isMoving) {
                    if (hunger > 2) hungerExhaustion += delta * 0.4; else isSprinting = false; 
                } else if (isMoving) {
                    hungerExhaustion += delta * 0.05;
                }
                
                if (hungerExhaustion > 10) { hungerExhaustion = 0; hunger = Math.max(0, hunger - 1); updateHUD(); }
                if (hunger === 0) { starvationTimer += delta; if (starvationTimer > 4) { takeDamage(1); starvationTimer = 0; } } 
                else if (hunger >= 9 && health < 10) { regenTimer += delta; if (regenTimer > 5) { health++; updateHUD(); regenTimer = 0; } }

                let speed = inWater ? 12.0 : (isSprinting ? 65.0 : 40.0);
                let speedMult = Math.max(Math.abs(moveState.forward), Math.abs(moveState.right));
                if (speedMult === 0 && !isMobile) speedMult = isMoving ? 1 : 0; 

                if (dir.lengthSq() > 0.01) {

                    stepTimer += delta; if(stepTimer > (isSprinting ? 0.25 : 0.4) && !inWater && canJump) { playSound('step'); stepTimer = 0; }
                } else { handGroup.position.y = -0.2; }

                let pos = camera.position;
                pos.x += velocity.x * delta; if (getCollisions(pos)) { pos.x -= velocity.x * delta; velocity.x = 0; }
                pos.z += velocity.z * delta; if (getCollisions(pos)) { pos.z -= velocity.z * delta; velocity.z = 0; }
                
                if(inWater) fallVelocityTracker = 0;

                pos.y += velocity.y * delta;
                if (getCollisions(pos)) {
                    pos.y -= velocity.y * delta;

            }
            prevTime = time; renderer.render(scene, camera);
        }

        function sendNetData(data) { connections.forEach(conn => { if (conn && conn.open) conn.send(data); }); }
        
        function handleNetData(data, senderConn) {
            if (data.type === 'pos') { updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry, data.name); if (isHost) sendNetData(data); }
            else if (data.type === 'block') {
                if (data.action === 'place') { worldMods[`${data.x},${data.y},${data.z}`] = {action: 'place', type: data.blockType}; addBlock(data.x, data.y, data.z, data.blockType, false); }
                if (data.action === 'break') { worldMods[`${data.x},${data.y},${data.z}`] = {action: 'break'}; spawnParticles(data.x, data.y, data.z, blockColors[blockData.get(`${data.x},${data.y},${data.z}`)?.type]); removeBlock(data.x, data.y, data.z, false); playSound('break'); }
                if (isHost) sendNetData(data);
            }
            else if (data.type === 'sync_world') {
                worldMods = data.changes;
                for (let key in worldMods) { let [x, y, z] = key.split(',').map(Number); if (worldMods[key].action === 'place') addBlock(x, y, z, worldMods[key].type, false); if (worldMods[key].action === 'break') removeBlock(x, y, z, false); }
            }
            else if (data.type === 'mob_spawn') { spawnMob(data.mob.x, data.mob.y, data.mob.z, data.mob.type); mobs[mobs.length-1].id = data.mob.id; }
            else if (data.type === 'mob_die') { let m = mobs.find(x=>x.id===data.id); if(m){ scene.remove(m.mesh); mobs = mobs.filter(x=>x!==m); } }
            else if (data.type === 'pvp_hit') { if (peer && data.targetId === peer.id) takeDamage(data.damage); if (isHost) sendNetData(data); }
            else if (data.type === 'chat') { addChatMessage(data.sender, data.text, "#ccc"); if(isHost) sendNetData(data); }
        }
