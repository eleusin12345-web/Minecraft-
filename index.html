<body>

                </div>
                <div class="arrow">➔</div>
                <div class="slot inv-slot" data-type="craftOut" data-idx="0" style="width:60px; height:60px; border-color:#000;"></div>
            </div>

            <!-- Хотбар в инвентаре (1 ряд по 9) -->
            <div style="height: 10px;"></div>
            <div id="inv-hotbar" class="inv-row"></div>

        </div>

    <div id="cursor-item">
        <div class="item-icon" id="cursor-icon"></div>

    <div id="ui-layer">
        <div id="crosshair">✛</div>
        <div id="break-progress-container"><div id="break-progress-bar"></div></div>

        <div class="hud-text" id="server-id-display">ID: <span id="sid-text"></span></div>
        <div id="hearts-container"></div>
        <div id="hotbar"></div>
    </div>

    <div id="mobile-controls">
        <div class="touch-zone" id="touch-left"></div><div class="touch-zone" id="touch-right"></div>
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        <div class="btn-mobile" id="btn-jump">⇡</div>
        <div class="btn-mobile" id="btn-action-mode">⚒️ Ломать</div>
        <div class="btn-mobile" id="btn-inv-mobile">🎒</div>
    </div>

    <script>
        // ==========================================
        // БАЗА И ДВИЖОК
        // ==========================================
        let camera, scene, renderer;
        const MAX_BLOCKS = 120000;
        let instancedMeshes = {}, blockData = new Map(), blockIndexToKey = {};
        let chunks = new Map(), chunkQueue = [], worldMods = {};
        
        const CHUNK_SIZE = 16, VIEW_DISTANCE = 3, WORLD_DEPTH = 30, WATER_LEVEL = 12;
        const simplex = new SimplexNoise('craft-seed'); // 2D шум для поверхности
        const simplex3D = new SimplexNoise('craft-cave'); // 3D шум для пещер
        
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);
        let gameStarted = false, isPointerLocked = false;
        
        // ==========================================
        // ПРЕДМЕТЫ, ИНВЕНТАРЬ И КРАФТ
        // ==========================================
        // ID: 1-Трава, 2-Земля, 3-Камень, 4-Дерево, 5-Листва, 6-Доски, 7-Вода, 8-Железо. Предметы: 100-Палка, 101-Дер.Кирка
        const INV_SIZE = 27, HOTBAR_SIZE = 9;
        let inventory = new Array(INV_SIZE).fill(null);
        let hotbar = new Array(HOTBAR_SIZE).fill(null);
        let craftGrid = new Array(4).fill(null);
        let craftResult = null;
        let activeHotbarSlot = 0;
        
        let cursorItem = null; // Предмет, который мы "держим" мышкой в инвентаре
        let isInvOpen = false;

        // Базовые предметы при старте
        hotbar[0] = { id: 101, count: 1 }; // Кирка
        hotbar[1] = { id: 4, count: 10 }; // Дерево

        const RECIPES = [
            { in: [4,0,0,0], out: {id: 6, count: 4} }, // Дерево -> 4 Доски
            { in: [6,0,6,0], out: {id: 100, count: 4} }, // 2 Доски вертик -> 4 Палки
            { in: [6,6,100,0], out: {id: 101, count: 1} } // Рецепт кирки 2x2 (упрощенный: 2 доски сверху, палка снизу слева)
        ];

        // ==========================================
        // ФИЗИКА, ДОБЫЧА И ДРОПЫ
        // ==========================================
        let health = 10, isDead = false, fallVelocityTracker = 0, inWater = false;
        let moveState = { forward: 0, right: 0 }, canJump = false, velocity = new THREE.Vector3();
        let prevTime = performance.now();
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        
        let drops = []; // Лежащие на земле предметы
        let mobs = []; // Животные
        
        // Система добычи (Mining)
        let miningBlock = null;
        let mineProgress = 0;
        let isMining = false;

        function getMineSpeed(blockId, toolId) {
            let speed = 1; // база рукой (1 сек)
            if (blockId === 3 || blockId === 8) speed = 0.2; // Камень рукой очень долго (5 сек)
            if (blockId === 1 || blockId === 2) speed = 1.5; // Земля быстрее
            if (blockId === 5) speed = 3; // Листва мгновенно
            
            // Бонусы инструментов
            if (toolId === 101 && (blockId === 3 || blockId === 8)) speed = 1.5; // Кирка по камню
            
            return speed;
        }

        // ==========================================
        // СЕТЬ
        // ==========================================
        let peer, connections = [], otherPlayers = new Map(), isHost = false;
        let mobileActionMode = 'break';

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ И РЕНДЕР БЛОКОВ
        // ==========================================
        function initEngine() {
            if (gameStarted) return;
            gameStarted = true;
            let el = document.documentElement;
            if(el.requestFullscreen) el.requestFullscreen();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, (VIEW_DISTANCE * CHUNK_SIZE) + 10);
            camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            respawnPlayer();

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x777788, 0.6);
            hemiLight.position.set(0, 100, 0); scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(100, 200, 50); scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            initBlocks();
            updateHeartsUI();
            buildInventoryHTML();
            renderInventory();
            updateChunks(true);
            setupControls();
            
            if (isHost) setInterval(updateMobs, 100); // Хост управляет ИИ

            requestAnimationFrame(animate);
        }

        function getMaterial(hex, isGrass=false, isWater=false) {
            if (isWater) return new THREE.MeshLambertMaterial({color: hex, transparent: true, opacity: 0.6});
            if (isGrass) return [
                new THREE.MeshLambertMaterial({color: 0x8B4513}), new THREE.MeshLambertMaterial({color: 0x8B4513}),
                new THREE.MeshLambertMaterial({color: 0x228B22}), new THREE.MeshLambertMaterial({color: 0x8B4513}),
                new THREE.MeshLambertMaterial({color: 0x8B4513}), new THREE.MeshLambertMaterial({color: 0x8B4513})
            ];
            return new THREE.MeshLambertMaterial({color: hex});
        }

        function initBlocks() {
            const blockGeo = new THREE.BoxGeometry(1, 1, 1);
            const mats = {
                1: getMaterial(0x228B22, true), 2: getMaterial(0x8B4513), 3: getMaterial(0x808080),
                4: getMaterial(0x654321), 5: getMaterial(0x006400), 6: getMaterial(0xcda26f),
                7: getMaterial(0x0000bb, false, true), 8: getMaterial(0x887777)
            };
            for(let i=1; i<=8; i++) {
                let imesh = new THREE.InstancedMesh(blockGeo, mats[i], MAX_BLOCKS);
                imesh.count = 0; scene.add(imesh);
                instancedMeshes[i] = imesh; blockIndexToKey[i] = [];
            }
        }

        const dummy = new THREE.Object3D();
        function addBlock(x, y, z, type, triggerNet = false) {
            if (type > 8 || type < 1) return; // Только ставящиеся блоки
            let key = `${x},${y},${z}`;
            if (blockData.has(key)) return;
            
            let mesh = instancedMeshes[type];
            let index = mesh.count;
            if (index >= MAX_BLOCKS) return;

            dummy.position.set(x, y, z); dummy.updateMatrix();
            mesh.setMatrixAt(index, dummy.matrix); mesh.instanceMatrix.needsUpdate = true;
            mesh.count++;
            blockData.set(key, {type: type, index: index});
            blockIndexToKey[type][index] = key;
            
            if (triggerNet) {
                worldMods[key] = { action: 'place', type: type };
                sendNetData({ type: 'block', action: 'place', x, y, z, blockType: type });
            }
        }

        function removeBlock(x, y, z, triggerNet = false) {
            let key = `${x},${y},${z}`;
            let block = blockData.get(key);
            if (!block) return;

            let type = block.type; let index = block.index;
            let mesh = instancedMeshes[type]; let lastIndex = mesh.count - 1;

            if (index !== lastIndex) {
                let lastMatrix = new THREE.Matrix4(); mesh.getMatrixAt(lastIndex, lastMatrix);
                mesh.setMatrixAt(index, lastMatrix);
                let lastKey = blockIndexToKey[type][lastIndex];
                blockData.get(lastKey).index = index; blockIndexToKey[type][index] = lastKey;
            }

            mesh.count--; mesh.instanceMatrix.needsUpdate = true; blockData.delete(key);
            
            if (triggerNet) {
                worldMods[key] = { action: 'break' };
                sendNetData({ type: 'block', action: 'break', x, y, z });
            }
            return type; // Возвращаем тип для дропа
        }

        // ==========================================
        // ГЕНЕРАЦИЯ МИРА (ПЕЩЕРЫ, ДЕРЕВЬЯ, ВОДА)
        // ==========================================
        function spawnTree(x, y, z) {
            for(let i=0; i<4; i++) addBlock(x, y+i, z, 4); // Ствол
            for(let dx=-2; dx<=2; dx++) {
                for(let dz=-2; dz<=2; dz++) {
                    for(let dy=3; dy<=5; dy++) {
                        if (Math.abs(dx)+Math.abs(dz) < 4) addBlock(x+dx, y+dy, z+dz, 5); // Листва
                    }
                }
            }
        }

        function generateChunk(cx, cz) {
            let key = `${cx},${cz}`;
            if (chunks.has(key)) return;
            chunks.set(key, true);

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    let wx = cx * CHUNK_SIZE + x, wz = cz * CHUNK_SIZE + z;
                    let h = Math.floor(simplex.noise2D(wx / 40, wz / 40) * 8) + 15; // Поверхность Y: 15-23
                    
                    // Глубокий мир и пещеры
                    for (let y = 0; y <= Math.max(h, WATER_LEVEL); y++) {
                        let bKey = `${wx},${y},${wz}`;
                        if (worldMods[bKey] && worldMods[bKey].action === 'break') continue;
                        if (worldMods[bKey] && worldMods[bKey].action === 'place') {
                            addBlock(wx, y, wz, worldMods[bKey].type); continue;
                        }

                        // Пещеры (3D шум)
                        let caveNoise = simplex3D.noise3D(wx/15, y/15, wz/15);
                        if (y < h - 2 && y > 2 && caveNoise > 0.4) continue; // Пустота (пещера)
                        
                        let type = 3; // Камень
                        if (y === h && y >= WATER_LEVEL) type = 1; // Трава
                        else if (y < h && y > h - 3) type = 2; // Земля
                        else if (y > h && y <= WATER_LEVEL) type = 7; // Вода (озера)
                        else if (y < h - 3 && Math.random() < 0.02) type = 8; // Железная руда
                        
                        addBlock(wx, y, wz, type);
                    }
                    
                    // Деревья
                    if (h >= WATER_LEVEL && Math.random() < 0.01 && !worldMods[`${wx},${h+1},${wz}`]) {
                        spawnTree(wx, h+1, wz);
                    }
                    // Спавн мобов (Хост решает)
                    if (isHost && h >= WATER_LEVEL && Math.random() < 0.005 && mobs.length < 15) {
                        spawnMob(wx, h+1, wz);
                    }
                }
            }
        }

        function updateChunks(forceSync = false) {
            let px = Math.floor(camera.position.x / CHUNK_SIZE), pz = Math.floor(camera.position.z / CHUNK_SIZE);
            for (let cx = px - VIEW_DISTANCE; cx <= px + VIEW_DISTANCE; cx++) {
                for (let cz = pz - VIEW_DISTANCE; cz <= pz + VIEW_DISTANCE; cz++) {
                    if (!chunks.has(`${cx},${cz}`) && !chunkQueue.some(q => q.cx===cx && q.cz===cz)) {
                        if (forceSync) generateChunk(cx, cz); else chunkQueue.push({cx, cz});
                    }
                }
            }
        }

        // ==========================================
        // ДРОПЫ И МОБЫ (ОВЦЫ)
        // ==========================================
        const itemGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        function spawnDrop(x, y, z, id, count=1) {
            // Используем CSS цвета для материалов предметов
            let color = 0xffffff;
            if(id===1) color=0x228B22; if(id===2) color=0x8B4513; if(id===3) color=0x808080;
            if(id===4) color=0x654321; if(id===8) color=0x887777; if(id===100) color=0x8b6b43;
            
            let mesh = new THREE.Mesh(itemGeo, new THREE.MeshLambertMaterial({color: color}));
            mesh.position.set(x, y, z);
            scene.add(mesh);
            drops.push({ mesh: mesh, id: id, count: count, ry: 0, life: 0 });
        }

        function spawnMob(x, y, z) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({color: 0xffffff})); // Овца
            mesh.position.set(x, y, z); scene.add(mesh);
            let mob = { id: Math.random().toString(36).substr(2, 9), mesh: mesh, vx: 0, vy: 0, vz: 0, hp: 3, rx: x, ry: y, rz: z, nextMove: 0 };
            mobs.push(mob);
            sendNetData({ type: 'mob_spawn', mob: { id: mob.id, x, y, z } });
        }

        function updateMobs() { // Логика только на Хосте
            let now = performance.now();
            mobs.forEach(mob => {
                if (now > mob.nextMove) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() > 0.5 ? 2 : 0;
                    mob.vx = Math.cos(angle) * speed; mob.vz = Math.sin(angle) * speed;
                    if(Math.random() > 0.7 && blockData.has(`${Math.round(mob.rx)},${Math.round(mob.ry-1)},${Math.round(mob.rz)}`)) mob.vy = 6;
                    mob.nextMove = now + 1000 + Math.random() * 3000;
                }
            });
        }

        // ==========================================
        // ИНВЕНТАРЬ И КРАФТИНГ (ЛОГИКА UI)
        // ==========================================
        function buildInventoryHTML() {
            let main = document.getElementById('inv-main');
            let hb = document.getElementById('inv-hotbar');
            let hudHb = document.getElementById('hotbar');
            
            for(let i=0; i<3; i++) {
                let row = document.createElement('div'); row.className = 'inv-row';
                for(let j=0; j<9; j++) {
                    let idx = i*9 + j;
                    row.innerHTML += `<div class="slot inv-slot" data-type="main" data-idx="${idx}"></div>`;
                }
                main.appendChild(row);
            }
            for(let i=0; i<9; i++) {
                hb.innerHTML += `<div class="slot inv-slot" data-type="hotbar" data-idx="${i}"></div>`;
                hudHb.innerHTML += `<div class="slot" id="hud-slot-${i}" onclick="selectHotbarSlot(${i})"></div>`;
            }
            selectHotbarSlot(0);

            // Обработчики кликов для всех слотов инвентаря
            document.querySelectorAll('.inv-slot').forEach(slot => {
                slot.addEventListener('mousedown', (e) => handleInvClick(e, slot));
                slot.addEventListener('touchstart', (e) => { e.preventDefault(); handleInvClick(e, slot); });
            });
        }

        function renderInventory() {
            const drawSlot = (el, item) => {
                if(item) el.innerHTML = `<div class="item-icon icon-${item.id}"></div><div class="item-count">${item.count>1?item.count:''}</div>`;
                else el.innerHTML = '';
            };
            
            document.querySelectorAll('.inv-slot').forEach(el => {
                let type = el.dataset.type, idx = parseInt(el.dataset.idx);
                if(type === 'main') drawSlot(el, inventory[idx]);
                if(type === 'hotbar') drawSlot(el, hotbar[idx]);
                if(type === 'craft') drawSlot(el, craftGrid[idx]);
                if(type === 'craftOut') drawSlot(el, craftResult);
            });

            // Обновляем HUD
            for(let i=0; i<9; i++) drawSlot(document.getElementById(`hud-slot-${i}`), hotbar[i]);

            // Курсор
            let cursorEl = document.getElementById('cursor-item');
            if(cursorItem) {
                cursorEl.style.display = 'block';
                document.getElementById('cursor-icon').className = `item-icon icon-${cursorItem.id}`;
                document.getElementById('cursor-count').innerText = cursorItem.count > 1 ? cursorItem.count : '';
            } else {
                cursorEl.style.display = 'none';
            }
        }

        function checkCrafting() {
            craftResult = null;
            let currentIn = craftGrid.map(i => i ? i.id : 0);
            for (let r of RECIPES) {
                if (r.in.join(',') === currentIn.join(',')) { craftResult = { id: r.out.id, count: r.out.count }; break; }
            }
        }

        function handleInvClick(e, slotEl) {
            let type = slotEl.dataset.type; let idx = parseInt(slotEl.dataset.idx);
            let targetArr = type==='main' ? inventory : (type==='hotbar' ? hotbar : (type==='craft' ? craftGrid : null));
            
            if (type === 'craftOut' && craftResult) {
                if (!cursorItem || (cursorItem.id === craftResult.id && cursorItem.count + craftResult.count <= 64)) {
                    if(!cursorItem) cursorItem = { id: craftResult.id, count: craftResult.count };
                    else cursorItem.count += craftResult.count;
                    // Тратим ресы
                    for(let i=0; i<4; i++) { if(craftGrid[i]) { craftGrid[i].count--; if(craftGrid[i].count<=0) craftGrid[i]=null; } }
                    checkCrafting(); renderInventory();
                }
                return;
            }

            if (!targetArr) return;
            let clickedItem = targetArr[idx];

            if (cursorItem) {
                if (!clickedItem) { // Положить все
                    targetArr[idx] = cursorItem; cursorItem = null;
                } else if (clickedItem.id === cursorItem.id) { // Сложить
                    let space = 64 - clickedItem.count;
                    let toAdd = Math.min(space, cursorItem.count);
                    clickedItem.count += toAdd; cursorItem.count -= toAdd;
                    if(cursorItem.count <= 0) cursorItem = null;
                } else { // Поменять местами
                    targetArr[idx] = cursorItem; cursorItem = clickedItem;
                }
            } else if (clickedItem) {
                if (e.button === 2 || e.type === 'contextmenu') { // Правый клик / долгое нажатие (половина)
                    let half = Math.ceil(clickedItem.count / 2);
                    cursorItem = { id: clickedItem.id, count: half };
                    clickedItem.count -= half;
                    if(clickedItem.count <= 0) targetArr[idx] = null;
                } else {
                    cursorItem = clickedItem; targetArr[idx] = null;
                }
            }
            if(type === 'craft') checkCrafting();
            renderInventory();
        }

        function selectHotbarSlot(idx) {
            activeHotbarSlot = idx;
            for(let i=0; i<9; i++) document.getElementById(`hud-slot-${i}`).classList.remove('active');
            document.getElementById(`hud-slot-${idx}`).classList.add('active');
        }

        function giveItem(id, count) {
            for(let i=0; i<HOTBAR_SIZE; i++) { if(hotbar[i] && hotbar[i].id === id && hotbar[i].count < 64) { hotbar[i].count += count; renderInventory(); return; } }
            for(let i=0; i<INV_SIZE; i++) { if(inventory[i] && inventory[i].id === id && inventory[i].count < 64) { inventory[i].count += count; renderInventory(); return; } }
            for(let i=0; i<HOTBAR_SIZE; i++) { if(!hotbar[i]) { hotbar[i] = {id, count}; renderInventory(); return; } }
            for(let i=0; i<INV_SIZE; i++) { if(!inventory[i]) { inventory[i] = {id, count}; renderInventory(); return; } }
        }

        // ==========================================
        // ФИЗИКА, ВЗАИМОДЕЙСТВИЕ
        // ==========================================
        function updateHeartsUI() {
            let hContainer = document.getElementById('hearts-container'); hContainer.innerHTML = '';
            for(let i = 0; i < 10; i++) hContainer.innerHTML += `<div class="heart">${i < health ? '❤️' : '🖤'}</div>`;
        }
        function takeDamage(amount) {
            if(isDead) return; health = Math.max(0, health - amount); updateHeartsUI();
            camera.position.y -= 0.2; // Эффект
            if(health === 0) { isDead = true; document.exitPointerLock(); document.getElementById('death-screen').style.display = 'flex'; document.getElementById('ui-layer').style.display = 'none'; }
        }
        function respawnPlayer() {
            isDead = false; health = 10; camera.position.set(8, 25, 8); velocity.set(0,0,0);
            updateHeartsUI(); document.getElementById('death-screen').style.display = 'none'; document.getElementById('ui-layer').style.display = 'block';
        }

        function getCollisions(pos) {
            let minX = Math.round(pos.x - 0.25), maxX = Math.round(pos.x + 0.25);
            let minY = Math.round(pos.y - 1.6), maxY = Math.round(pos.y + 0.1); 
            let minZ = Math.round(pos.z - 0.25), maxZ = Math.round(pos.z + 0.25);
            inWater = false;
            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        let b = blockData.get(`${x},${y},${z}`);
                        if (b) { if(b.type === 7) inWater = true; else return true; } // Вода не коллизия, но ставит флаг
                    }
                }
            }
            return false;
        }

        function getRaycastHit() {
            let pos = camera.position.clone(), dir = new THREE.Vector3();
            camera.getWorldDirection(dir); dir.normalize();
            let step = 0.1, dist = 0, lastPos = null;
            while (dist < 6) {
                pos.addScaledVector(dir, step); dist += step;
                let bx = Math.round(pos.x), by = Math.round(pos.y), bz = Math.round(pos.z);
                let key = `${bx},${by},${bz}`;
                
                // Проверка удара по мобу
                for(let m of mobs) {
                    if(Math.abs(m.mesh.position.x - pos.x)<0.6 && Math.abs(m.mesh.position.y - pos.y)<0.6 && Math.abs(m.mesh.position.z - pos.z)<0.6) {
                        return { type: 'mob', mob: m };
                    }
                }
                let b = blockData.get(key);
                if (b && b.type !== 7) return { type: 'block', key, bx, by, bz, blockType: b.type, lastPos }; // Игнорим воду при клике
                lastPos = { x: bx, y: by, z: bz };
            }
            return null;
        }

        function processAction(isPlace) {
            if(isDead || isInvOpen) return;
            let hit = getRaycastHit();
            if(!hit) return;

            let activeItem = hotbar[activeHotbarSlot];

            if(isPlace) {
                if(hit.type === 'block' && hit.lastPos && activeItem && activeItem.id < 100) { // Можно ставить только блоки (id < 100)
                    addBlock(hit.lastPos.x, hit.lastPos.y, hit.lastPos.z, activeItem.id, true);
                    activeItem.count--; if(activeItem.count <= 0) hotbar[activeHotbarSlot] = null;
                    renderInventory();
                }
            } else {
                if(hit.type === 'mob') {
                    hit.mob.hp--; hit.mob.vy = 4; // Отброс
                    if(hit.mob.hp <= 0) {
                        scene.remove(hit.mob.mesh); mobs = mobs.filter(m => m !== hit.mob);
                        spawnDrop(hit.mob.mesh.position.x, hit.mob.mesh.position.y, hit.mob.mesh.position.z, 20); // Дропаем что-то
                        if(isHost) sendNetData({type: 'mob_die', id: hit.mob.id});
                    }
                    isMining = false;
                } else if(hit.type === 'block') {
                    isMining = true;
                    if (miningBlock !== hit.key) { miningBlock = hit.key; mineProgress = 0; }
                }
            }
        }

        // ==========================================
        // УПРАВЛЕНИЕ И ИВЕНТЫ
        // ==========================================
        function toggleInventory() {
            if(isDead) return; isInvOpen = !isInvOpen;
            let inv = document.getElementById('inventory-ui');
            if (isInvOpen) {
                document.exitPointerLock(); inv.style.display = 'flex';
                if(isMobile) document.getElementById('mobile-controls').style.display = 'none';
            } else {
                inv.style.display = 'none';
                if(cursorItem) { giveItem(cursorItem.id, cursorItem.count); cursorItem = null; renderInventory(); } // Возврат предмета
                if(!isMobile) document.body.requestPointerLock();
                if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
            }
        }

        function setupControls() {
            // Движение мыши (инвентарь)
            document.addEventListener('mousemove', (e) => {
                if(isInvOpen && cursorItem) {
                    let c = document.getElementById('cursor-item');
                    c.style.left = e.clientX - 20 + 'px'; c.style.top = e.clientY - 20 + 'px';
                }
            });

            if (!isMobile) {
                document.addEventListener('keydown', (e) => {
                    if (isDead) return;
                    if (e.code === 'KeyW') moveState.forward = 1; if (e.code === 'KeyS') moveState.forward = -1;
                    if (e.code === 'KeyA') moveState.right = -1; if (e.code === 'KeyD') moveState.right = 1;
                    if (e.code === 'Space' && (canJump || inWater)) { velocity.y = inWater ? 6 : 11; canJump = false; }
                    if (e.code >= 'Digit1' && e.code <= 'Digit9') selectHotbarSlot(parseInt(e.key)-1);
                    if (e.code === 'KeyE') toggleInventory();
                });
                document.addEventListener('keyup', (e) => {
                    if (e.code === 'KeyW' || e.code === 'KeyS') moveState.forward = 0;
                    if (e.code === 'KeyA' || e.code === 'KeyD') moveState.right = 0;
                });
                document.addEventListener('mousedown', (e) => {
                    if (isDead || document.getElementById('menu').style.display !== 'none') return;
                    if (isInvOpen) return;
                    if (!isPointerLocked) document.body.requestPointerLock();
                    else {
                        if (e.button === 0) isMining = true;
                        if (e.button === 2) processAction(true); // ПКМ - Ставить
                    }
                });
                document.addEventListener('mouseup', (e) => { if (e.button === 0) { isMining = false; mineProgress = 0; } });
                document.addEventListener('mousemove', (e) => {
                    if (isPointerLocked && !isDead) {
                        euler.setFromQuaternion(camera.quaternion); euler.y -= e.movementX * 0.002; euler.x -= e.movementY * 0.002;
                        euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x)); camera.quaternion.setFromEuler(euler);
                    }
                });
                document.addEventListener('pointerlockchange', () => {
                    isPointerLocked = document.pointerLockElement === document.body;
                    if (!isInvOpen && !isDead && gameStarted) {
                        document.getElementById('menu').style.display = isPointerLocked ? 'none' : 'flex';
                        document.getElementById('ui-layer').style.display = isPointerLocked ? 'block' : 'none';
                    }
                });
            } else {
                document.getElementById('mobile-controls').style.display = 'block';
                document.getElementById('btn-inv-mobile').addEventListener('touchstart', (e)=>{ e.preventDefault(); toggleInventory(); });
                
                const btnAction = document.getElementById('btn-action-mode');
                btnAction.addEventListener('touchstart', (e) => {
                    e.preventDefault(); mobileActionMode = mobileActionMode === 'break' ? 'place' : 'break';
                    btnAction.innerHTML = mobileActionMode === 'break' ? '⚒️ Ломать' : '🧱 Ставить';
                });
                document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); if (canJump || inWater) { velocity.y = inWater?6:11; canJump = false; }});

                let rightTouchId = null, lastRight = {x:0, y:0}, isDragging = false, touchStartTime = 0;
                document.getElementById('touch-right').addEventListener('touchstart', (e) => {
                    e.preventDefault(); rightTouchId = e.changedTouches[0].identifier; lastRight = {x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY};
                    isDragging = false; touchStartTime = Date.now();
                });
                document.getElementById('touch-right').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === rightTouchId) {
                            let dx = e.changedTouches[i].clientX - lastRight.x, dy = e.changedTouches[i].clientY - lastRight.y;
                            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
                            if(!isDead && !isInvOpen) {
                                euler.setFromQuaternion(camera.quaternion); euler.y -= dx * 0.005; euler.x -= dy * 0.005;
                                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x)); camera.quaternion.setFromEuler(euler);
                            }
                            lastRight = {x: e.changedTouches[i].clientX, y: e.changedTouches[i].clientY};
                        }
                    }
                });
                document.getElementById('touch-right').addEventListener('touchend', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === rightTouchId) {
                            rightTouchId = null; isMining = false; mineProgress = 0;
                            if (!isDragging && (Date.now() - touchStartTime < 300)) {
                                if(mobileActionMode === 'place') processAction(true); else isMining = true; // Триггерим майнинг на 1 кадр
                            }
                        }
                    }
                });
                
                // Левый стик опущен для краткости, берется из предыдущего, но добавим базово
                const joyBase = document.getElementById('joystick-base'), joyKnob = document.getElementById('joystick-knob');
                let leftTouchId = null, joyCenter = {x:0, y:0};
                document.getElementById('touch-left').addEventListener('touchstart', (e) => {
                    e.preventDefault(); leftTouchId = e.changedTouches[0].identifier;
                    joyBase.style.display = 'flex'; joyBase.style.left = (e.changedTouches[0].clientX - 60) + 'px'; joyBase.style.top = (e.changedTouches[0].clientY - 60) + 'px';
                    joyCenter = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                });
                document.getElementById('touch-left').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === leftTouchId) {
                            let dx = e.changedTouches[i].clientX - joyCenter.x, dy = e.changedTouches[i].clientY - joyCenter.y;
                            let dist = Math.min(50, Math.sqrt(dx*dx + dy*dy)), angle = Math.atan2(dy, dx);
                            joyKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                            moveState.right = Math.max(-1, Math.min(1, dx / 40)); moveState.forward = Math.max(-1, Math.min(1, -dy / 40)); 
                        }
                    }
                });
                const resetLeftJoy = (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === leftTouchId) {
                            leftTouchId = null; moveState.forward = 0; moveState.right = 0;
                            joyBase.style.display = 'none'; joyKnob.style.transform = 'translate(0,0)';
                        }
                    }
                };
                document.getElementById('touch-left').addEventListener('touchend', resetLeftJoy);
            }
        }

        // ==========================================
        // ИГРОВОЙ ЦИКЛ
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Очередь чанков
            let chunksProcessed = 0;
            while(chunkQueue.length > 0 && chunksProcessed < 2) {
                let chunk = chunkQueue.shift(); generateChunk(chunk.cx, chunk.cz); chunksProcessed++;
            }

            const time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.05); 
            
            // Физика мобов и дропов
            drops.forEach((d, idx) => {
                d.ry += delta * 2; d.mesh.rotation.y = d.ry;
                d.mesh.position.y += Math.sin(time*0.005) * 0.005; // Покачивание
                
                // Подбор предмета
                if(camera.position.distanceTo(d.mesh.position) < 2) {
                    giveItem(d.id, d.count);
                    scene.remove(d.mesh); drops.splice(idx, 1);
                }
            });
            mobs.forEach(m => { // Примитивная физика мобов
                m.vy -= 9.8 * delta;
                m.rx += m.vx * delta; m.ry += m.vy * delta; m.rz += m.vz * delta;
                if(blockData.has(`${Math.round(m.rx)},${Math.round(m.ry-1)},${Math.round(m.rz)}`)) { m.ry = Math.round(m.ry); m.vy = 0; }
                m.mesh.position.set(m.rx, m.ry, m.rz);
            });

            if ((isPointerLocked || isMobile) && !isDead && !isInvOpen) {
                // Майнинг
                let pBar = document.getElementById('break-progress-container');
                let pFill = document.getElementById('break-progress-bar');
                if (isMining) {
                    let hit = getRaycastHit();
                    if (hit && hit.type === 'block' && hit.key === miningBlock) {
                        pBar.style.display = 'block';
                        let toolId = hotbar[activeHotbarSlot] ? hotbar[activeHotbarSlot].id : 0;
                        mineProgress += delta * getMineSpeed(hit.blockType, toolId);
                        pFill.style.width = Math.min(mineProgress * 100, 100) + '%';
                        
                        if (mineProgress >= 1) {
                            let droppedType = removeBlock(hit.bx, hit.by, hit.bz, true);
                            spawnDrop(hit.bx, hit.by, hit.bz, droppedType);
                            isMining = false; mineProgress = 0; pBar.style.display = 'none';
                        }
                    } else { isMining = false; mineProgress = 0; }
                } else { pBar.style.display = 'none'; }

                // Физика игрока
                fallVelocityTracker = velocity.y;
                let drag = inWater ? 5.0 : 12.0; // В воде трение больше
                let grav = inWater ? 3.0 : 35.0; // В воде гравитация меньше

                velocity.x -= velocity.x * drag * delta;
                velocity.z -= velocity.z * drag * delta;
                velocity.y -= grav * delta; 

                let dir = new THREE.Vector3(moveState.right, 0, -moveState.forward);
                dir.applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();

                let speed = inWater ? 15.0 : 45.0;
                let speedMult = Math.max(Math.abs(moveState.forward), Math.abs(moveState.right));
                if (speedMult === 0 && !isMobile) speedMult = (moveState.forward !== 0 || moveState.right !== 0) ? 1 : 0; 

                if (dir.lengthSq() > 0.01) {
                    velocity.x += dir.x * speed * speedMult * delta; velocity.z += dir.z * speed * speedMult * delta;
                }

                let pos = camera.position;
                pos.x += velocity.x * delta; if (getCollisions(pos)) { pos.x -= velocity.x * delta; velocity.x = 0; }
                pos.z += velocity.z * delta; if (getCollisions(pos)) { pos.z -= velocity.z * delta; velocity.z = 0; }
                pos.y += velocity.y * delta;
                if (getCollisions(pos)) {
                    pos.y -= velocity.y * delta;
                    if (velocity.y < 0) {
                        canJump = true;
                        if (fallVelocityTracker < -22 && !inWater) {
                            let dmg = Math.floor((Math.abs(fallVelocityTracker) - 20) / 4);
                            if(dmg > 0) takeDamage(dmg);
                        }
                    }
                    velocity.y = 0;
                } else { canJump = false; }

                if (getCollisions(pos)) pos.y += 0.2; 
                if (pos.y < -5) takeDamage(10); // Упал в бездну

                updateChunks(false);
            }
            
            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { if(camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }});

        // ==========================================
        // СЕТЬ
        // ==========================================
        function updateOtherPlayer(id, x, y, z, ry) {
            if (!otherPlayers.has(id)) {
                let m = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), new THREE.MeshLambertMaterial({color: Math.random()*0xffffff}));
                scene.add(m); otherPlayers.set(id, m);
            }
            let p = otherPlayers.get(id); p.position.set(x, y - 0.9, z); p.rotation.y = ry;
        }

        function sendNetData(data) { connections.forEach(conn => { if (conn && conn.open) conn.send(data); }); }

        function handleNetData(data, senderConn) {
            if (data.type === 'pos') { updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry); if (isHost) sendNetData(data); }
            else if (data.type === 'block') {
                if (data.action === 'place') { worldMods[`${data.x},${data.y},${data.z}`] = {action: 'place', type: data.blockType}; addBlock(data.x, data.y, data.z, data.blockType, false); }
                if (data.action === 'break') { worldMods[`${data.x},${data.y},${data.z}`] = {action: 'break'}; removeBlock(data.x, data.y, data.z, false); }
                if (isHost) sendNetData(data);
            }
            else if (data.type === 'sync_world') {
                worldMods = data.changes;
                for (let key in worldMods) {
                    let [x, y, z] = key.split(',').map(Number);
                    if (worldMods[key].action === 'place') addBlock(x, y, z, worldMods[key].type, false);
                    if (worldMods[key].action === 'break') removeBlock(x, y, z, false);
                }
            }
            else if (data.type === 'mob_spawn') { spawnMob(data.mob.x, data.mob.y, data.mob.z); mobs[mobs.length-1].id = data.mob.id; }
            else if (data.type === 'mob_die') { let m = mobs.find(x=>x.id===data.id); if(m){ scene.remove(m.mesh); mobs = mobs.filter(x=>x!==m); } }
        }

        function setupConnectionEvents(conn) {
            conn.on('open', () => {
                document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`;
                if (isHost) conn.send({ type: 'sync_world', changes: worldMods });
            });
            conn.on('data', (data) => handleNetData(data, conn));
            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                if (otherPlayers.has(conn.peer)) { scene.remove(otherPlayers.get(conn.peer)); otherPlayers.delete(conn.peer); }
                document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`;
            });
        }

        const statusDiv = document.getElementById('status');
        document.getElementById('btn-single').addEventListener('click', () => { initEngine(); document.getElementById('menu').style.display = 'none'; });
        document.getElementById('btn-host').addEventListener('click', () => {
            statusDiv.innerText = 'Создание...'; peer = new Peer();
            peer.on('open', (id) => {
                isHost = true; document.getElementById('server-id-display').style.display = 'block'; document.getElementById('sid-text').innerText = id;
                initEngine(); document.getElementById('menu').style.display = 'none';
                setInterval(() => { if (camera && !isDead) sendNetData({ type: 'pos', id: peer.id, x: camera.position.x, y: camera.position.y, z: camera.position.z, ry: euler.y }); }, 50);
            });
            peer.on('connection', (conn) => { connections.push(conn); setupConnectionEvents(conn); });
        });
        document.getElementById('btn-join').addEventListener('click', () => {
            const hostId = document.getElementById('join-id').value.trim(); if (!hostId) return; statusDiv.innerText = 'Подключение...';
            peer = new Peer();
            peer.on('open', () => {
                const conn = peer.connect(hostId);
                conn.on('open', () => { connections.push(conn); setupConnectionEvents(conn); initEngine(); document.getElementById('menu').style.display = 'none';
                setInterval(() => { if (camera && !isDead) sendNetData({ type: 'pos', id: peer.id, x: camera.position.x, y: camera.position.y, z: camera.position.z, ry: euler.y }); }, 50); });
            });
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
