    <script>
        // === ГЕНЕРАТОР ПИКСЕЛЬНЫХ ТЕКСТУР ДЛЯ БЛОКОВ ===
        const textureCache = {};
        function createPixelTexture(type) {
            if(textureCache[type]) return textureCache[type];
            let cvs = document.createElement('canvas'); cvs.width = 16; cvs.height = 16;
            let ctx = cvs.getContext('2d');
            
            const drawNoise = (hex, varRGB, y1=0, y2=16) => {
                let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
                for(let x=0; x<16; x++) {
                    for(let y=y1; y<y2; y++) {
                        let v = (Math.random()-0.5)*varRGB;
                        ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r+v))},${Math.max(0,Math.min(255,g+v))},${Math.max(0,Math.min(255,b+v))})`;
                        ctx.fillRect(x,y,1,1);
                    }
                }
            };

            if(type === 'dirt') { drawNoise('#7a5c3d', 30); }
            else if(type === 'grass_top') { drawNoise('#559c3f', 40); }
            else if(type === 'grass_side') { 
                drawNoise('#7a5c3d', 30); 
                drawNoise('#559c3f', 40, 0, 4); 
                for(let x=0; x<16; x++) if(Math.random()>0.5) drawNoise('#559c3f', 40, 4, 5+Math.random()*2);
            }
            else if(type === 'stone') { drawNoise('#888888', 25); }
            else if(type === 'cobble') { 
                drawNoise('#777777', 40); 
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; for(let i=0; i<10; i++) { ctx.fillRect(Math.random()*16, Math.random()*16, 2, 2); }
                ctx.fillStyle = 'rgba(255,255,255,0.2)'; for(let i=0; i<10; i++) { ctx.fillRect(Math.random()*16, Math.random()*16, 2, 2); }
            }
            else if(type === 'planks') { 
                drawNoise('#cda26f', 20); 
                ctx.fillStyle = '#8b6b43';
                for(let y=0; y<16; y+=4) { ctx.fillRect(0,y,16,1); ctx.fillRect(Math.random()*16, y, 1, 4); }
            }
            else if(type === 'log_side') { 
                drawNoise('#5c4033', 15); ctx.fillStyle = '#3a2211';
                for(let x=0; x<16; x+=3+Math.random()*2) ctx.fillRect(x,0,1,16);
            }
            else if(type === 'log_top') { 
                drawNoise('#8b5a2b', 10); ctx.strokeStyle = '#5c3a21'; ctx.lineWidth=1;
                for(let r=2; r<8; r+=2) ctx.strokeRect(8-r, 8-r, r*2, r*2);
            }
            else if(type === 'leaves') {
                ctx.clearRect(0,0,16,16);
                drawNoise('#3a7a3a', 40);
                for(let i=0; i<40; i++) { ctx.clearRect(Math.random()*16, Math.random()*16, 1, 1); }
            }
            else if(type === 'water') { 
                drawNoise('#3498db', 15); 
                ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(0, Math.random()*16, 16, 1); 
            }
            else if(type === 'glass') { 
                ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(0,0,16,16); 
                ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth=1; ctx.strokeRect(0,0,16,16);
                ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(2,2,4,1); ctx.fillRect(2,3,1,3);
            }
            else if(type === 'workbench_top') {
                drawNoise('#cda26f', 20); ctx.fillStyle = '#5c4033';
                for(let x=1; x<16; x+=5) ctx.fillRect(x,0,1,16); for(let y=1; y<16; y+=5) ctx.fillRect(0,y,16,1);
            }
            else if(type === 'workbench_side') {

        function addBlock(x, y, z, type, triggerNet = false) {
            if (!instancedMeshes[type]) return; 
            let key = `${x},${y},${z}`; if (blockData.has(key)) return;
            let mesh = instancedMeshes[type], index = mesh.count; if (index >= MAX_BLOCKS) return;
            dummy.position.set(x, y, z); dummy.updateMatrix();
            mesh.setMatrixAt(index, dummy.matrix); mesh.instanceMatrix.needsUpdate = true; mesh.count++;
            blockData.set(key, {type: type, index: index}); blockIndexToKey[type][index] = key;
            
            let cx = Math.floor(x/CHUNK_SIZE), cz = Math.floor(z/CHUNK_SIZE), cKey = `${cx},${cz}`;
            if(!chunkBlocks.has(cKey)) chunkBlocks.set(cKey, []); chunkBlocks.get(cKey).push(key);

            if (triggerNet) { worldMods[key] = { action: 'place', type: type }; sendNetData({ type: 'block', action: 'place', x, y, z, blockType: type }); }
        }

        function removeBlock(x, y, z, triggerNet = false) {
            let key = `${x},${y},${z}`; let block = blockData.get(key); if (!block) return null;
            let type = block.type, index = block.index;
            let mesh = instancedMeshes[type], lastIndex = mesh.count - 1;
            if (index !== lastIndex) {
                let lastMatrix = new THREE.Matrix4(); mesh.getMatrixAt(lastIndex, lastMatrix);
                mesh.setMatrixAt(index, lastMatrix); let lastKey = blockIndexToKey[type][lastIndex];
                blockData.get(lastKey).index = index; blockIndexToKey[type][index] = lastKey;
            }
            mesh.count--; mesh.instanceMatrix.needsUpdate = true; blockData.delete(key);
            
            if (triggerNet) { worldMods[key] = { action: 'break' }; sendNetData({ type: 'block', action: 'break', x, y, z }); }
            
            if (type === 3) return 8; 
            if (type === 15) return 110; 
            if (type === 5) return Math.random() < 0.1 ? 109 : 0; 
            if (type === 9) return 0; // Стекло разбивается
            
            return type;
        }

        function generateChunk(cx, cz) {
            let key = `${cx},${cz}`; if (chunks.has(key)) return; chunks.set(key, true);
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    let wx = cx * CHUNK_SIZE + x, wz = cz * CHUNK_SIZE + z;
                    let h = Math.floor(simplex.noise2D(wx / 40, wz / 40) * 8) + 15; 
                    if (Math.random() < 0.05 && simplex.noise2D(wx/20, wz/20) > 0.6) addBlock(wx, 40, wz, 9); // Воздушное стекло
                    
                    for (let y = 0; y <= Math.max(h, WATER_LEVEL); y++) {
                        let bKey = `${wx},${y},${wz}`;
                        if (worldMods[bKey] && worldMods[bKey].action === 'break') continue;
                        if (worldMods[bKey] && worldMods[bKey].action === 'place') { addBlock(wx, y, wz, worldMods[bKey].type); continue; }
                        if (y < h - 2 && y > 2 && simplex3D.noise3D(wx/15, y/15, wz/15) > 0.4) continue; 
                        let type = 3; 
                        if (y === h && y >= WATER_LEVEL) type = 1; else if (y < h && y > h - 3) type = 2; 
                        else if (y > h && y <= WATER_LEVEL) type = 7; else if (y < h - 3 && Math.random() < 0.03) type = 8; 
                        
                        if (type === 3 && y < h - 5 && Math.random() < 0.03) type = 15;
                        
                        addBlock(wx, y, wz, type);

                    if (h >= WATER_LEVEL && Math.random() < 0.01 && !worldMods[`${wx},${h+1},${wz}`]) spawnTree(wx, h+1, wz);

                }
            }
        }

        function updateChunks(forceSync = false) {
            let px = Math.floor(camera.position.x / CHUNK_SIZE), pz = Math.floor(camera.position.z / CHUNK_SIZE);
            for (let cx = px - VIEW_DISTANCE; cx <= px + VIEW_DISTANCE; cx++) {
                for (let cz = pz - VIEW_DISTANCE; cz <= pz + VIEW_DISTANCE; cz++) {
                    if (!chunks.has(`${cx},${cz}`) && !chunkQueue.some(q => q.cx===cx && q.cz===cz)) {
                        if (forceSync) generateChunk(cx, cz); else chunkQueue.push({cx, cz});
                    }
                }
            }
            for (let [cKey, bArr] of chunkBlocks.entries()) {
                let [cx, cz] = cKey.split(',').map(Number);
                if (Math.abs(cx - px) > VIEW_DISTANCE + 1 || Math.abs(cz - pz) > VIEW_DISTANCE + 1) {
                    bArr.forEach(bKey => { let [bx, by, bz] = bKey.split(',').map(Number); removeBlock(bx, by, bz, false); });
                    chunkBlocks.delete(cKey); chunks.delete(cKey);
                }
            }
        }

        function renderInventory() {
            const drawSlot = (el, item) => {
                if(item) {
                    let typeClass = '';
                    if([101,104,105].includes(item.id)) typeClass = 'pickaxe';
                    if([106,107,108].includes(item.id)) typeClass = 'sword';
                    if([111,112,113].includes(item.id)) typeClass = 'axe';
                    if([114,115,116].includes(item.id)) typeClass = 'shovel';
                    
                    let cCls = `item-icon icon-${item.id} ${typeClass}`;
                    el.innerHTML = `<div class="${cCls}"></div><div class="item-count">${item.count>1?item.count:''}</div>`;
                } else el.innerHTML = '';
            };
            document.querySelectorAll('.inv-slot').forEach(el => {
                let type = el.dataset.type, idx = parseInt(el.dataset.idx);
                if(type === 'main') drawSlot(el, inventory[idx]); if(type === 'hotbar') drawSlot(el, hotbar[idx]);
                if(type === 'craft') drawSlot(el, craftGrid[idx]); if(type === 'craftOut') drawSlot(el, craftResult);
            });
            for(let i=0; i<9; i++) drawSlot(document.getElementById(`hud-slot-${i}`), hotbar[i]);

            let cursorEl = document.getElementById('cursor-item');
            if(cursorItem) {
                cursorEl.style.display = 'block'; 
                let typeClass = '';
                if([101,104,105].includes(cursorItem.id)) typeClass = 'pickaxe';
                if([106,107,108].includes(cursorItem.id)) typeClass = 'sword';
                if([111,112,113].includes(cursorItem.id)) typeClass = 'axe';
                if([114,115,116].includes(cursorItem.id)) typeClass = 'shovel';
                document.getElementById('cursor-icon').className = `item-icon icon-${cursorItem.id} ${typeClass}`;
                document.getElementById('cursor-count').innerText = cursorItem.count > 1 ? cursorItem.count : '';
            } else cursorEl.style.display = 'none';
        }

        function getCraftString(arr, cols) {
            let minX = cols, maxX = -1, minY = cols, maxY = -1;
            for(let i=0; i<arr.length; i++) {
                if(arr[i]) {
                    let x = i % cols, y = Math.floor(i / cols);
                    if(x < minX) minX = x; if(x > maxX) maxX = x;
                    if(y < minY) minY = y; if(y > maxY) maxY = y;
                }
            }
            if(maxX === -1) return {str: "", w: 0, h: 0, minX, maxX, minY, maxY};
            let res = [];
            for(let y = minY; y <= maxY; y++) {
                for(let x = minX; x <= maxX; x++) res.push(arr[y*cols + x] ? arr[y*cols + x].id : 0);
                res.push('|');
            }
            return { str: res.join(','), w: maxX-minX+1, h: maxY-minY+1, minX, maxX, minY, maxY };
        }

        function checkCrafting() {
            craftResult = null;
            let p = getCraftString(craftGrid, 3);
            if(p.str === "") return;
            if(currentCraftMode === 'inv' && (p.w > 2 || p.h > 2)) return;
            
            for (let r of RECIPES) {
                if (r.in === p.str) { craftResult = { id: r.out.id, count: r.out.count }; break; }
            }
        }

        function handleInvClick(e, slotEl) {
            let type = slotEl.dataset.type, idx = parseInt(slotEl.dataset.idx);
            let targetArr = type==='main' ? inventory : (type==='hotbar' ? hotbar : (type==='craft' ? craftGrid : null));
            let currentMode = (e.button === 2) ? 'half' : invMode;
            
            if (type === 'craftOut' && craftResult) {
                if (!cursorItem || (cursorItem.id === craftResult.id && cursorItem.count + craftResult.count <= 64)) {
                    playSound('step');
                    if(!cursorItem) cursorItem = { id: craftResult.id, count: craftResult.count }; else cursorItem.count += craftResult.count;
                    
                    let p = getCraftString(craftGrid, 3);
                    for(let y = p.minY; y <= p.maxY; y++) {
                        for(let x = p.minX; x <= p.maxX; x++) {
                            let i = y*3 + x;
                            if(craftGrid[i]) { craftGrid[i].count--; if(craftGrid[i].count<=0) craftGrid[i]=null; }
                        }
                    }
                    checkCrafting(); renderInventory();
                } return;
            }
            if (!targetArr) return;
            let clickedItem = targetArr[idx];

            if (cursorItem) {
                if (!clickedItem) {
                    if (currentMode === 'one') { targetArr[idx] = { id: cursorItem.id, count: 1 }; cursorItem.count--; if(cursorItem.count <= 0) cursorItem = null; }
                    else { targetArr[idx] = cursorItem; cursorItem = null; }
                } else if (clickedItem.id === cursorItem.id) {
                    if (currentMode === 'one') { if(clickedItem.count < 64) { clickedItem.count++; cursorItem.count--; if(cursorItem.count<=0) cursorItem = null; } }
                    else { let space = 64 - clickedItem.count, toAdd = Math.min(space, cursorItem.count); clickedItem.count += toAdd; cursorItem.count -= toAdd; if(cursorItem.count <= 0) cursorItem = null; }
                } else { if(currentMode === 'all') { targetArr[idx] = cursorItem; cursorItem = clickedItem; } }
            } else if (clickedItem) {
                if (currentMode === 'half') { let half = Math.ceil(clickedItem.count / 2); cursorItem = { id: clickedItem.id, count: half }; clickedItem.count -= half; if(clickedItem.count <= 0) targetArr[idx] = null; }
                else if (currentMode === 'one') { cursorItem = { id: clickedItem.id, count: 1 }; clickedItem.count--; if(clickedItem.count <= 0) targetArr[idx] = null; }
                else { cursorItem = clickedItem; targetArr[idx] = null; }
            }
            if(type === 'craft') checkCrafting(); renderInventory();
        }

        function selectHotbarSlot(idx) { activeHotbarSlot = idx; for(let i=0; i<9; i++) document.getElementById(`hud-slot-${i}`).classList.remove('active'); document.getElementById(`hud-slot-${idx}`).classList.add('active'); handAnim = 1.0; }
        
        function giveItem(id, count) {
            playSound('step');
            for(let i=0; i<HOTBAR_SIZE; i++) { if(hotbar[i] && hotbar[i].id === id && hotbar[i].count < 64) { let s = 64 - hotbar[i].count, add = Math.min(s, count); hotbar[i].count += add; count -= add; if(count<=0){ renderInventory(); return;} } }
            for(let i=0; i<INV_SIZE; i++) { if(inventory[i] && inventory[i].id === id && inventory[i].count < 64) { let s = 64 - inventory[i].count, add = Math.min(s, count); inventory[i].count += add; count -= add; if(count<=0){ renderInventory(); return;} } }
            for(let i=0; i<HOTBAR_SIZE; i++) { if(!hotbar[i]) { hotbar[i] = {id, count}; renderInventory(); return; } }
            for(let i=0; i<INV_SIZE; i++) { if(!inventory[i]) { inventory[i] = {id, count}; renderInventory(); return; } }
        }

        function takeDamage(amount) {

        function respawnPlayer() {

            updateHUD(); document.getElementById('death-screen').style.display = 'none'; document.getElementById('ui-layer').style.display = 'block';

        function getCollisions(pos) {
            let minX = Math.round(pos.x - 0.25), maxX = Math.round(pos.x + 0.25), minY = Math.round(pos.y - 1.6), maxY = Math.round(pos.y + 0.1), minZ = Math.round(pos.z - 0.25), maxZ = Math.round(pos.z + 0.25);
            inWater = false;
            for (let x = minX; x <= maxX; x++) for (let y = minY; y <= maxY; y++) for (let z = minZ; z <= maxZ; z++) {
                let b = blockData.get(`${x},${y},${z}`);
                if (b) { if(b.type === 7) inWater = true; else if(b.type !== 9) return true; }
            }
            return false;
        }

        function getRaycastHit() {
            let pos = camera.position.clone(), dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.normalize();
            let step = 0.1, dist = 0, lastPos = null;
            while (dist < 6) {
                pos.addScaledVector(dir, step); dist += step;
                let bx = Math.round(pos.x), by = Math.round(pos.y), bz = Math.round(pos.z);
                
                for(let [otherId, pMesh] of otherPlayers) {
                    let center = pMesh.position.clone().add(new THREE.Vector3(0, 0.9, 0));
                    if (center.distanceTo(pos) < 1.2) return { type: 'player', peerId: otherId };
                }
                for(let m of mobs) if(Math.abs(m.mesh.position.x - pos.x)<0.7 && Math.abs(m.mesh.position.y - pos.y)<0.7 && Math.abs(m.mesh.position.z - pos.z)<0.7) return { type: 'mob', mob: m };
                let b = blockData.get(`${bx},${by},${bz}`);
                if (b && b.type !== 7 && b.type !== 9) return { type: 'block', key: `${bx},${by},${bz}`, bx, by, bz, blockType: b.type, lastPos }; 
                lastPos = { x: bx, by: by, bz: bz };
            }
            return null;
        }

        function processAction(isRightClick) {
            if(isDead || isInvOpen) return;
            handAnim = 1.0; 
            let hit = getRaycastHit(); 
            let activeItem = hotbar[activeHotbarSlot];

            if(isRightClick) {
                if (hit && hit.type === 'block' && hit.blockType === 11) {
                    openInventory('workbench');
                    return;
                }
                
                if (activeItem && (activeItem.id === 102 || activeItem.id === 109)) { 
                    if (hunger < 10 || health < 10) { 
                        hunger = Math.min(10, hunger + (activeItem.id===109 ? 2 : 4)); 
                        health = Math.min(10, health + (activeItem.id===109 ? 1 : 2)); 
                        activeItem.count--; if(activeItem.count <= 0) hotbar[activeHotbarSlot] = null; 
                        updateHUD(); renderInventory(); playSound('eat'); 
                        return;
                    }
                }

                if(hit && hit.type === 'block' && hit.lastPos && activeItem && activeItem.id < 100) { 
                    addBlock(hit.lastPos.x, hit.lastPos.by, hit.lastPos.bz, activeItem.id, true);
                    activeItem.count--; if(activeItem.count <= 0) hotbar[activeHotbarSlot] = null;
                    renderInventory(); playSound('step');
                }
            } else {
                if(!hit) return;
                let toolId = activeItem ? activeItem.id : 0;
                let dmg = getWeaponDamage(toolId);
                if(hit.type === 'mob') {
                    hit.mob.hp -= dmg; hit.mob.vy = 4; hit.mob.vx = (hit.mob.rx - camera.position.x)*3; hit.mob.vz = (hit.mob.rz - camera.position.z)*3;
                    playSound('hit');
                    if(hit.mob.hp <= 0) {
                        scene.remove(hit.mob.mesh); mobs = mobs.filter(m => m !== hit.mob);
                        spawnDrop(hit.mob.rx, hit.mob.ry, hit.mob.rz, hit.mob.type===1 ? 103 : 102, 1); 
                        if(isHost) sendNetData({type: 'mob_die', id: hit.mob.id});
                    }
                    isMining = false; miningBlock = null;
                } else if(hit.type === 'player') {
                    sendNetData({ type: 'pvp_hit', targetId: hit.peerId, damage: dmg }); playSound('hit');
                    isMining = false; miningBlock = null;
                }
            }
        }

        function openInventory(mode) {
            if(isDead) return; 
            isInvOpen = true;
            setCraftMode(mode);
            document.exitPointerLock(); 
            document.getElementById('inventory-ui').style.display = 'flex';
            if(isMobile) document.getElementById('mobile-controls').style.display = 'none';
        }

        function toggleInventory() {
            if(isDead) return;
            if (isInvOpen) {
                isInvOpen = false;
                document.getElementById('inventory-ui').style.display = 'none';
                
                if(cursorItem) { giveItem(cursorItem.id, cursorItem.count); cursorItem = null; } 
                for(let i=0; i<9; i++) { if(craftGrid[i]) { giveItem(craftGrid[i].id, craftGrid[i].count); craftGrid[i] = null; } }
                craftResult = null;
                renderInventory();

                if(!isMobile) document.body.requestPointerLock();
                if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
            } else {
                openInventory('inv');
            }
        }

        function setupControls() {
            document.addEventListener('mousemove', (e) => { if(isInvOpen && cursorItem) { let c = document.getElementById('cursor-item'); c.style.left = e.clientX - 20 + 'px'; c.style.top = e.clientY - 20 + 'px'; }});
            document.addEventListener('contextmenu', e => e.preventDefault());

            document.addEventListener('wheel', (e) => {
                if(!isInvOpen && !isDead && gameStarted && document.getElementById('menu').style.display === 'none') {
                    if(e.deltaY > 0) activeHotbarSlot = (activeHotbarSlot + 1) % 9;
                    else activeHotbarSlot = (activeHotbarSlot + 8) % 9;
                    selectHotbarSlot(activeHotbarSlot);
                }
            });

            let chatInput = document.getElementById('chat-input');
            if (!isMobile) {
                document.addEventListener('keydown', (e) => {
                    if (isDead) return;
                    
                    if (e.code === 'Escape') {
                        if (isInvOpen) toggleInventory();
                        return;
                    }

                    if (e.code === 'Enter' || e.code === 'KeyT') {
                        if (!isPointerLocked && document.activeElement === chatInput) {
                            if (chatInput.value.trim() !== '') {
                                let msg = chatInput.value.trim(); addChatMessage(myName, msg, "#55ff55");
                                if (peer) sendNetData({type: 'chat', text: msg, sender: myName}); chatInput.value = '';
                            }
                            chatInput.style.display = 'none'; document.body.requestPointerLock();
                        } else { document.exitPointerLock(); chatInput.style.display = 'block'; chatInput.focus(); e.preventDefault(); }
                    }
                    if (document.activeElement === chatInput) return;

                    if (e.code === 'KeyW') moveState.forward = 1; if (e.code === 'KeyS') moveState.forward = -1;
                    if (e.code === 'KeyA') moveState.right = -1; if (e.code === 'KeyD') moveState.right = 1;
                    if (e.code === 'Space' && (canJump || inWater)) { velocity.y = inWater ? 5 : 9; canJump = false; }
                    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSprinting = true;
                    
                    if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                        if (isInvOpen && hoveredSlot && hoveredSlot.type !== 'craft' && hoveredSlot.type !== 'craftOut') {
                            let targetIdx = parseInt(e.key) - 1;
                            let hoverArr = hoveredSlot.type === 'main' ? inventory : (hoveredSlot.type === 'hotbar' ? hotbar : null);
                            if (hoverArr && (hoverArr !== hotbar || hoveredSlot.idx !== targetIdx)) {
                                let temp = hoverArr[hoveredSlot.idx]; hoverArr[hoveredSlot.idx] = hotbar[targetIdx]; hotbar[targetIdx] = temp; renderInventory();
                            }
                        } else if (!isInvOpen) {
                            selectHotbarSlot(parseInt(e.key)-1);
                        }
                    }

                    if (e.code === 'KeyE') toggleInventory();
                });
                document.addEventListener('keyup', (e) => {
                    if (e.code === 'KeyW' || e.code === 'KeyS') moveState.forward = 0; if (e.code === 'KeyA' || e.code === 'KeyD') moveState.right = 0;
                    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSprinting = false;
                });
                document.addEventListener('mousedown', (e) => {
                    if (isDead || document.getElementById('menu').style.display !== 'none' || isInvOpen || document.activeElement === chatInput) return;
                    if (!isPointerLocked) document.body.requestPointerLock();
                    else { if (e.button === 0) { isMining = true; processAction(false); } if (e.button === 2) processAction(true); }
                });
                document.addEventListener('mouseup', (e) => { if (e.button === 0) { isMining = false; miningBlock = null; } });
                document.addEventListener('mousemove', (e) => {
                    if (isPointerLocked && !isDead) { euler.setFromQuaternion(camera.quaternion); euler.y -= e.movementX * 0.002; euler.x -= e.movementY * 0.002; euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x)); camera.quaternion.setFromEuler(euler); }
                });
            } else {
                document.getElementById('mobile-controls').style.display = 'block';
                document.getElementById('btn-inv-mobile').addEventListener('touchstart', (e)=>{ e.preventDefault(); toggleInventory(); });
                document.getElementById('btn-mine').addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); isMining = true; processAction(false); });
                document.getElementById('btn-mine').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); isMining = false; miningBlock = null; });
                document.getElementById('btn-place').addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); processAction(true); });
                document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); if (canJump || inWater) { velocity.y = inWater?5:9; canJump = false; }});
                
                let btnSprint = document.getElementById('btn-sprint');
                btnSprint.addEventListener('touchstart', (e)=>{ e.preventDefault(); isSprinting=true; btnSprint.style.background='rgba(255,255,255,0.6)';});
                btnSprint.addEventListener('touchend', (e)=>{ e.preventDefault(); isSprinting=false; btnSprint.style.background='';});

                let rightTouchId = null, lastRight = {x:0, y:0};
                document.getElementById('touch-right').addEventListener('touchstart', (e) => { e.preventDefault(); rightTouchId = e.changedTouches[0].identifier; lastRight = {x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY}; });
                document.getElementById('touch-right').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === rightTouchId && !isDead && !isInvOpen) {
                            let dx = e.changedTouches[i].clientX - lastRight.x, dy = e.changedTouches[i].clientY - lastRight.y;
                            euler.setFromQuaternion(camera.quaternion); euler.y -= dx * 0.005; euler.x -= dy * 0.005; euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x)); camera.quaternion.setFromEuler(euler);
                            lastRight = {x: e.changedTouches[i].clientX, y: e.changedTouches[i].clientY};
                        }
                    }
                });
                document.getElementById('touch-right').addEventListener('touchend', (e) => { e.preventDefault(); for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === rightTouchId) rightTouchId = null; });
                
                const joyBase = document.getElementById('joystick-base'), joyKnob = document.getElementById('joystick-knob');
                let leftTouchId = null, joyCenter = {x:0, y:0};
                document.getElementById('touch-left').addEventListener('touchstart', (e) => {
                    e.preventDefault(); leftTouchId = e.changedTouches[0].identifier;
                    joyBase.style.display = 'flex'; joyBase.style.left = (e.changedTouches[0].clientX - 55) + 'px'; joyBase.style.top = (e.changedTouches[0].clientY - 55) + 'px'; joyCenter = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                });
                document.getElementById('touch-left').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === leftTouchId) {
                            let dx = e.changedTouches[i].clientX - joyCenter.x, dy = e.changedTouches[i].clientY - joyCenter.y;
                            let dist = Math.min(45, Math.sqrt(dx*dx + dy*dy)), angle = Math.atan2(dy, dx);
                            joyKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                            moveState.right = Math.max(-1, Math.min(1, dx / 40)); moveState.forward = Math.max(-1, Math.min(1, -dy / 40)); 
                        }
                    }
                });
                const resetLeftJoy = (e) => { e.preventDefault(); for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === leftTouchId) { leftTouchId = null; moveState.forward = 0; moveState.right = 0; joyBase.style.display = 'none'; joyKnob.style.transform = 'translate(0,0)'; } };

        function createNameTag(name) {
            let canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
            let ctx = canvas.getContext('2d'); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,256,64);

        let stepTimer = 0;
        function animate() {
            requestAnimationFrame(animate);
            let chunksProcessed = 0; while(chunkQueue.length > 0 && chunksProcessed < 2) { let chunk = chunkQueue.shift(); generateChunk(chunk.cx, chunk.cz); chunksProcessed++; }

            const time = performance.now(); let delta = Math.min((time - prevTime) / 1000, 0.05); 
            
            dayTime += delta * 0.002; 
            let sunAng = dayTime % (Math.PI*2);
            let intensity = Math.max(0.1, Math.sin(sunAng));
            
            if (camera && dirLight) {
                dirLight.position.set(Math.cos(sunAng)*40 + camera.position.x, Math.sin(sunAng)*40 + camera.position.y, Math.sin(sunAng)*10 + camera.position.z);
                dirLight.target.position.copy(camera.position); dirLight.target.updateMatrixWorld();
                dirLight.intensity = intensity * 1.5; ambientLight.intensity = 0.2 + intensity * 0.3;
                let sr = Math.floor(135*intensity), sg = Math.floor(206*intensity), sb = Math.floor(235*intensity + 20*(1-intensity));
                let skyColor = new THREE.Color(`rgb(${sr},${sg},${sb})`); scene.background = skyColor; scene.fog.color = skyColor;
            }

            for(let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i]; d.ry += delta * 2; d.mesh.rotation.y = d.ry; d.mesh.position.y += Math.sin(time*0.005) * 0.005; 
                if(camera.position.distanceTo(d.mesh.position) < 2.5) { giveItem(d.id, d.count); scene.remove(d.mesh); drops.splice(i, 1); }
            }
            
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.life -= delta;
                if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); continue; }
                p.vy -= 9.8 * delta; p.mesh.position.set(p.mesh.position.x + p.vx*delta, p.mesh.position.y + p.vy*delta, p.mesh.position.z + p.vz*delta);
            }

            for(let i = mobs.length - 1; i >= 0; i--) {
                let m = mobs[i]; m.vy -= 9.8 * delta; m.rx += m.vx * delta; m.ry += m.vy * delta; m.rz += m.vz * delta;
                if(blockData.has(`${Math.round(m.rx)},${Math.round(m.ry-1)},${Math.round(m.rz)}`)) { m.ry = Math.round(m.ry); m.vy = 0; }
                m.mesh.position.set(m.rx, m.ry, m.rz);
            }

            if ((isPointerLocked || isMobile) && !isDead && !isInvOpen) {
                let hit = getRaycastHit();
                if (hit && hit.type === 'block') {
                    blockOutline.position.set(hit.bx, hit.by, hit.bz);
                    blockOutline.visible = true;
                } else {
                    blockOutline.visible = false;
                }

                if (handAnim > 0) { handAnim -= delta * 5; handGroup.rotation.x = Math.sin(handAnim * Math.PI) * -0.6; } else { handGroup.rotation.x = 0; }

                let pBar = document.getElementById('break-progress-container'), pFill = document.getElementById('break-progress-bar');
                if (isMining && hit && hit.type === 'block') {
                    if (miningBlock !== hit.key) { miningBlock = hit.key; mineProgress = 0; } 
                    else {
                        pBar.style.display = 'block';
                        let toolId = hotbar[activeHotbarSlot] ? hotbar[activeHotbarSlot].id : 0;
                        mineProgress += delta * getMineSpeed(hit.blockType, toolId);
                        pFill.style.width = Math.min(mineProgress * 100, 100) + '%';
                        if (mineProgress >= 1) {
                            playSound('break'); spawnParticles(hit.bx, hit.by, hit.bz, blockColors[hit.blockType]);
                            let droppedType = removeBlock(hit.bx, hit.by, hit.bz, true); spawnDrop(hit.bx, hit.by, hit.bz, droppedType);
                            miningBlock = null; mineProgress = 0; pBar.style.display = 'none'; handAnim = 1.0;
                        }
                    }
                } else { miningBlock = null; mineProgress = 0; pBar.style.display = 'none'; }

                fallVelocityTracker = velocity.y;
                let drag = inWater ? 4.0 : 12.0, grav = inWater ? 4.0 : 35.0; 
                velocity.x -= velocity.x * drag * delta; velocity.z -= velocity.z * drag * delta; velocity.y -= grav * delta; 

                let dir = new THREE.Vector3(moveState.right, 0, -moveState.forward);
                dir.applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();

                let isMoving = (moveState.forward !== 0 || moveState.right !== 0);
                
                if (isSprinting && isMoving) {
                    if (hunger > 2) hungerExhaustion += delta * 0.4; else isSprinting = false; 
                } else if (isMoving) {
                    hungerExhaustion += delta * 0.05;
                }
                
                if (hungerExhaustion > 10) { hungerExhaustion = 0; hunger = Math.max(0, hunger - 1); updateHUD(); }
                if (hunger === 0) { starvationTimer += delta; if (starvationTimer > 4) { takeDamage(1); starvationTimer = 0; } } 
                else if (hunger >= 9 && health < 10) { regenTimer += delta; if (regenTimer > 5) { health++; updateHUD(); regenTimer = 0; } }

                let speed = inWater ? 12.0 : (isSprinting ? 65.0 : 40.0);
                let speedMult = Math.max(Math.abs(moveState.forward), Math.abs(moveState.right));
                if (speedMult === 0 && !isMobile) speedMult = isMoving ? 1 : 0; 

                if (dir.lengthSq() > 0.01) {

                    stepTimer += delta; if(stepTimer > (isSprinting ? 0.25 : 0.4) && !inWater && canJump) { playSound('step'); stepTimer = 0; }
                } else { handGroup.position.y = -0.2; }

                let pos = camera.position;
                pos.x += velocity.x * delta; if (getCollisions(pos)) { pos.x -= velocity.x * delta; velocity.x = 0; }
                pos.z += velocity.z * delta; if (getCollisions(pos)) { pos.z -= velocity.z * delta; velocity.z = 0; }
                
                if(inWater) fallVelocityTracker = 0;

                pos.y += velocity.y * delta;
                if (getCollisions(pos)) {
                    pos.y -= velocity.y * delta;
                    if (velocity.y < 0) {
                        canJump = true;
                        if (fallVelocityTracker < -22 && !inWater) { let dmg = Math.floor((Math.abs(fallVelocityTracker) - 20) / 4); if(dmg > 0) takeDamage(dmg); }
                    }
                    velocity.y = 0;
                } else canJump = false;

                if (getCollisions(pos)) pos.y += 0.2; 
                if (pos.y < -5) takeDamage(10); 
                updateChunks(false);
            }
            prevTime = time; renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { if(camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }});

        function updateOtherPlayer(id, x, y, z, ry, name) {

        function sendNetData(data) { connections.forEach(conn => { if (conn && conn.open) conn.send(data); }); }
        
        function handleNetData(data, senderConn) {
            if (data.type === 'pos') { updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry, data.name); if (isHost) sendNetData(data); }
            else if (data.type === 'block') {
                if (data.action === 'place') { worldMods[`${data.x},${data.y},${data.z}`] = {action: 'place', type: data.blockType}; addBlock(data.x, data.y, data.z, data.blockType, false); }
                if (data.action === 'break') { worldMods[`${data.x},${data.y},${data.z}`] = {action: 'break'}; spawnParticles(data.x, data.y, data.z, blockColors[blockData.get(`${data.x},${data.y},${data.z}`)?.type]); removeBlock(data.x, data.y, data.z, false); playSound('break'); }
                if (isHost) sendNetData(data);
            }
            else if (data.type === 'sync_world') {
                worldMods = data.changes;
                for (let key in worldMods) { let [x, y, z] = key.split(',').map(Number); if (worldMods[key].action === 'place') addBlock(x, y, z, worldMods[key].type, false); if (worldMods[key].action === 'break') removeBlock(x, y, z, false); }
            }
            else if (data.type === 'mob_spawn') { spawnMob(data.mob.x, data.mob.y, data.mob.z, data.mob.type); mobs[mobs.length-1].id = data.mob.id; }
            else if (data.type === 'mob_die') { let m = mobs.find(x=>x.id===data.id); if(m){ scene.remove(m.mesh); mobs = mobs.filter(x=>x!==m); } }
            else if (data.type === 'pvp_hit') { if (peer && data.targetId === peer.id) takeDamage(data.damage); if (isHost) sendNetData(data); }
            else if (data.type === 'chat') { addChatMessage(data.sender, data.text, "#ccc"); if(isHost) sendNetData(data); }
        }

        function setupConnectionEvents(conn) {
            conn.on('open', () => { document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`; if (isHost) conn.send({ type: 'sync_world', changes: worldMods }); });
            conn.on('data', (data) => handleNetData(data, conn));
            conn.on('close', () => {

                    pMesh.children.forEach(c => { if(c.material) { if(c.material.map) c.material.map.dispose(); c.material.dispose(); } });
                    otherPlayers.delete(conn.peer);

            });
        }
