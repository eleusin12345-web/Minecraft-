<body>

        <div id="hearts-container"></div>

        <div id="hotbar">
            <!-- 5 слотов хотбара, хранят ID блоков (по умолчанию 1-5) -->
            <div class="slot active" id="slot-1" data-slot="1" data-block="1"><div class="blk-1" style="width:100%; height:100%;"></div></div>
            <div class="slot" id="slot-2" data-slot="2" data-block="2"><div class="blk-2" style="width:100%; height:100%;"></div></div>
            <div class="slot" id="slot-3" data-slot="3" data-block="3"><div class="blk-3" style="width:100%; height:100%;"></div></div>
            <div class="slot" id="slot-4" data-slot="4" data-block="4"><div class="blk-4" style="width:100%; height:100%;"></div></div>
            <div class="slot" id="slot-5" data-slot="5" data-block="5"><div class="blk-5" style="width:100%; height:100%;"></div></div>
        </div>
    </div>

    <!-- Инвентарь -->
    <div id="inventory">
        <h2>Инвентарь (Выбери блок)</h2>
        <div id="inv-grid">
            <!-- Генерируется через JS -->
        </div>
        <p style="color:#555; margin-top:15px; font-size:18px;">Блок будет назначен в активный слот хотбара</p>
        <button class="btn" id="btn-close-inv" style="background:#888; border-color:#666;">Закрыть</button>
    </div>

    <!-- Мобильное управление -->
    <div id="mobile-controls">
        <div class="touch-zone" id="touch-left"></div>
        <div class="touch-zone" id="touch-right"></div>
        
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        
        <div class="btn-mobile" id="btn-jump">⇡</div>
        <div class="btn-mobile" id="btn-action-mode">⚒️ Ломать</div>
        <div class="btn-mobile" id="btn-inv-mobile">🎒</div>
    </div>

    <script>
        // ==========================================
        // 1. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ДВИЖОК
        // ==========================================
        let camera, scene, renderer;
        
        const MAX_BLOCKS = 80000;
        let instancedMeshes = {}; 
        let blockData = new Map(); 
        let blockIndexToKey = {};  
        let chunks = new Map();
        let chunkQueue = []; // Оптимизация: очередь генерации чанков
        let worldMods = {}; 

        const CHUNK_SIZE = 16, VIEW_DISTANCE = 3; 
        const simplex = new SimplexNoise('webcraft-lan-seed');
        
        let currentSlot = 1;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);
        
        // Здоровье и Падение
        let health = 10;
        let isDead = false;
        let fallVelocityTracker = 0;

        // Физика
        let moveState = { forward: 0, right: 0 };
        let canJump = false;
        let velocity = new THREE.Vector3();
        let prevTime = performance.now();
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let isPointerLocked = false;
        let isInvOpen = false;
        let gameStarted = false;
        const dummy = new THREE.Object3D(); 

        // Сеть
        let peer, connections = [], otherPlayers = new Map(), isHost = false;
        let mobileActionMode = 'break';

        function goFullScreen() {
            let el = document.documentElement;
            if(el.requestFullscreen) el.requestFullscreen();
            else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }

        function initEngine() {
            if (gameStarted) return;
            gameStarted = true;
            goFullScreen(); // Запрос полного экрана

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, (VIEW_DISTANCE * CHUNK_SIZE) + 10);

            camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
            respawnPlayer(); // Установка начальной позиции

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x777788, 0.6);
            hemiLight.position.set(0, 100, 0);
            scene.add(hemiLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(100, 200, 50);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            initBlocks();
            updateHeartsUI();
            setupInventoryUI();
            updateChunks(true); // Форсируем первую загрузку
            setupControls();
            
            requestAnimationFrame(animate);
        }

        // ==========================================
        // 2. БЛОКИ И ОПТИМИЗИРОВАННАЯ ГЕНЕРАЦИЯ
        // ==========================================
        function getMaterial(hex, isGrass=false) {
            if(isGrass) return [
                new THREE.MeshLambertMaterial({color: 0x8B4513}), new THREE.MeshLambertMaterial({color: 0x8B4513}),
                new THREE.MeshLambertMaterial({color: 0x228B22}), new THREE.MeshLambertMaterial({color: 0x8B4513}),
                new THREE.MeshLambertMaterial({color: 0x8B4513}), new THREE.MeshLambertMaterial({color: 0x8B4513})
            ];
            return new THREE.MeshLambertMaterial({color: hex});
        }

        function initBlocks() {
            const blockGeo = new THREE.BoxGeometry(1, 1, 1);
            // 10 типов блоков
            const mats = {
                1: getMaterial(0x228B22, true), 2: getMaterial(0x8B4513), 3: getMaterial(0x808080),
                4: getMaterial(0x654321), 5: getMaterial(0xffd700), 6: getMaterial(0xcda26f),
                7: getMaterial(0x006400), 8: getMaterial(0xb22222), 9: getMaterial(0x696969), 10: getMaterial(0x2b1d3d)
            };
            for(let i=1; i<=10; i++) {
                let imesh = new THREE.InstancedMesh(blockGeo, mats[i], MAX_BLOCKS);
                imesh.count = 0;
                scene.add(imesh);
                instancedMeshes[i] = imesh;
                blockIndexToKey[i] = [];
            }
        }

        function addBlock(x, y, z, type, triggerNet = false) {
            let key = `${x},${y},${z}`;
            if (blockData.has(key)) return;
            
            let mesh = instancedMeshes[type];
            let index = mesh.count;
            if (index >= MAX_BLOCKS) return;

            dummy.position.set(x, y, z); dummy.updateMatrix();
            mesh.setMatrixAt(index, dummy.matrix); mesh.instanceMatrix.needsUpdate = true;
            mesh.count++;

            blockData.set(key, {type: type, index: index});
            blockIndexToKey[type][index] = key;
            
            if (triggerNet) {
                worldMods[key] = { action: 'place', type: type };
                sendNetData({ type: 'block', action: 'place', x, y, z, blockType: type });
            }
        }

        function removeBlock(x, y, z, triggerNet = false) {
            let key = `${x},${y},${z}`;
            let block = blockData.get(key);
            if (!block) return;

            let type = block.type; let index = block.index;
            let mesh = instancedMeshes[type]; let lastIndex = mesh.count - 1;

            if (index !== lastIndex) {
                let lastMatrix = new THREE.Matrix4(); mesh.getMatrixAt(lastIndex, lastMatrix);
                mesh.setMatrixAt(index, lastMatrix);
                let lastKey = blockIndexToKey[type][lastIndex];
                let lastBlockInfo = blockData.get(lastKey);
                lastBlockInfo.index = index; blockIndexToKey[type][index] = lastKey;
            }

            mesh.count--; mesh.instanceMatrix.needsUpdate = true; blockData.delete(key);
            
            if (triggerNet) {
                worldMods[key] = { action: 'break' };
                sendNetData({ type: 'block', action: 'break', x, y, z });
            }
        }

        function generateChunk(cx, cz) {
            let key = `${cx},${cz}`;
            if (chunks.has(key)) return;
            chunks.set(key, true);

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    let wx = cx * CHUNK_SIZE + x, wz = cz * CHUNK_SIZE + z;
                    let h = Math.floor(simplex.noise2D(wx / 35, wz / 35) * 6) + 6;
                    
                    if (!worldMods[`${wx},${h},${wz}`] || worldMods[`${wx},${h},${wz}`].action !== 'break') 
                        addBlock(wx, h, wz, h < 5 ? 5 : 1);
                    if (!worldMods[`${wx},${h-1},${wz}`] || worldMods[`${wx},${h-1},${wz}`].action !== 'break') 
                        addBlock(wx, h - 1, wz, 2);
                    if (!worldMods[`${wx},${h-2},${wz}`] || worldMods[`${wx},${h-2},${wz}`].action !== 'break') 
                        addBlock(wx, h - 2, wz, 3);
                }
            }
        }

        function updateChunks(forceSync = false) {
            let px = Math.floor(camera.position.x / CHUNK_SIZE);
            let pz = Math.floor(camera.position.z / CHUNK_SIZE);
            for (let cx = px - VIEW_DISTANCE; cx <= px + VIEW_DISTANCE; cx++) {
                for (let cz = pz - VIEW_DISTANCE; cz <= pz + VIEW_DISTANCE; cz++) {
                    let key = `${cx},${cz}`;
                    if (!chunks.has(key) && !chunkQueue.some(q => q.cx===cx && q.cz===cz)) {
                        if (forceSync) generateChunk(cx, cz);
                        else chunkQueue.push({cx, cz});
                    }
                }
            }
        }

        // ==========================================
        // 3. СИСТЕМА ВЫЖИВАНИЯ И ФИЗИКА
        // ==========================================
        function updateHeartsUI() {
            let hContainer = document.getElementById('hearts-container');
            hContainer.innerHTML = '';
            for(let i = 0; i < 10; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerText = i < health ? '❤️' : '🖤';
                hContainer.appendChild(heart);
            }
        }

        function takeDamage(amount) {
            if (isDead) return;
            health -= amount;
            if (health < 0) health = 0;
            updateHeartsUI();
            
            // Эффект урона (дергаем камеру)
            camera.position.y -= 0.2;
            
            if (health === 0) die();
        }

        function die() {
            isDead = true;
            document.exitPointerLock();
            document.getElementById('death-screen').style.display = 'flex';
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('mobile-controls').style.display = 'none';
        }

        function respawnPlayer() {
            isDead = false;
            health = 10;
            camera.position.set(8, 40, 8); // Респавн наверху
            velocity.set(0,0,0);
            updateHeartsUI();
            document.getElementById('death-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';
            if (isMobile) document.getElementById('mobile-controls').style.display = 'block';
            if (!isMobile) document.body.requestPointerLock();
        }

        document.getElementById('btn-respawn').addEventListener('click', respawnPlayer);
        document.getElementById('btn-to-menu').addEventListener('click', () => location.reload()); // Перезагрузка возвращает в меню

        function getCollisions(pos) {
            let minX = Math.round(pos.x - 0.25), maxX = Math.round(pos.x + 0.25);
            let minY = Math.round(pos.y - 1.6), maxY = Math.round(pos.y + 0.1); 
            let minZ = Math.round(pos.z - 0.25), maxZ = Math.round(pos.z + 0.25);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (blockData.has(`${x},${y},${z}`)) return true;
                    }
                }
            }
            return false;
        }

        function interact(isPlace) {
            if (isDead || isInvOpen) return;
            let pos = camera.position.clone();
            let dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.normalize();

            let step = 0.1, dist = 0, lastPos = null;
            let activeBlockType = parseInt(document.getElementById(`slot-${currentSlot}`).dataset.block);

            while (dist < 7) {
                pos.addScaledVector(dir, step); dist += step;
                let bx = Math.round(pos.x), by = Math.round(pos.y), bz = Math.round(pos.z);
                let key = `${bx},${by},${bz}`;

                if (blockData.has(key)) {
                    if (isPlace && lastPos) addBlock(lastPos.x, lastPos.y, lastPos.z, activeBlockType, true);
                    else if (!isPlace) removeBlock(bx, by, bz, true);
                    return;
                }
                lastPos = { x: bx, y: by, z: bz };
            }
        }

        // ==========================================
        // 4. ИНТЕРФЕЙС И УПРАВЛЕНИЕ
        // ==========================================
        function selectSlot(slotIndex) {
            currentSlot = slotIndex;
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
            document.getElementById(`slot-${slotIndex}`).classList.add('active');
        }

        function toggleInventory() {
            if (isDead) return;
            isInvOpen = !isInvOpen;
            let inv = document.getElementById('inventory');
            if (isInvOpen) {
                document.exitPointerLock();
                inv.style.display = 'flex';
                if(isMobile) document.getElementById('mobile-controls').style.display = 'none';
            } else {
                inv.style.display = 'none';
                if(!isMobile) document.body.requestPointerLock();
                if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
            }
        }

        function setupInventoryUI() {
            let grid = document.getElementById('inv-grid');
            for(let i=1; i<=10; i++) {
                let div = document.createElement('div');
                div.className = 'slot';
                div.innerHTML = `<div class="blk-${i}" style="width:100%; height:100%;"></div>`;
                div.onclick = () => {
                    // Назначаем блок в активный слот хотбара
                    let activeSlotEl = document.getElementById(`slot-${currentSlot}`);
                    activeSlotEl.dataset.block = i;
                    activeSlotEl.innerHTML = `<div class="blk-${i}" style="width:100%; height:100%;"></div>`;
                    toggleInventory(); // закрываем
                };
                grid.appendChild(div);
            }
            
            // Фикс касаний для хотбара
            for(let i=1; i<=5; i++) {
                let slot = document.getElementById(`slot-${i}`);
                slot.addEventListener('mousedown', (e) => { e.stopPropagation(); selectSlot(i); });
                slot.addEventListener('touchstart', (e) => { e.stopPropagation(); selectSlot(i); });
            }
            
            document.getElementById('btn-close-inv').onclick = toggleInventory;
            document.getElementById('btn-inv-mobile').addEventListener('touchstart', (e) => { e.stopPropagation(); toggleInventory(); });
        }

        function setupControls() {
            if (!isMobile) {
                document.addEventListener('keydown', (e) => {
                    if (isDead) return;
                    if (e.code === 'KeyW') moveState.forward = 1;
                    if (e.code === 'KeyS') moveState.forward = -1;
                    if (e.code === 'KeyA') moveState.right = -1;
                    if (e.code === 'KeyD') moveState.right = 1;
                    if (e.code === 'Space' && canJump) { velocity.y = 11; canJump = false; }
                    if (e.code >= 'Digit1' && e.code <= 'Digit5') selectSlot(parseInt(e.key));
                    if (e.code === 'KeyE') toggleInventory();
                });
                document.addEventListener('keyup', (e) => {
                    if (e.code === 'KeyW' || e.code === 'KeyS') moveState.forward = 0;
                    if (e.code === 'KeyA' || e.code === 'KeyD') moveState.right = 0;
                });
                document.addEventListener('mousedown', (e) => {
                    if (isDead || isInvOpen || document.getElementById('menu').style.display !== 'none') return;
                    if (!isPointerLocked) document.body.requestPointerLock();
                    else interact(e.button === 2); 
                });
                document.addEventListener('mousemove', (e) => {
                    if (isPointerLocked && !isDead) {
                        euler.setFromQuaternion(camera.quaternion);
                        euler.y -= e.movementX * 0.002; euler.x -= e.movementY * 0.002;
                        euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                        camera.quaternion.setFromEuler(euler);
                    }
                });
                document.addEventListener('pointerlockchange', () => {
                    isPointerLocked = document.pointerLockElement === document.body;
                    if (!isInvOpen && !isDead && gameStarted) {
                        document.getElementById('menu').style.display = isPointerLocked ? 'none' : 'flex';
                        document.getElementById('ui-layer').style.display = isPointerLocked ? 'block' : 'none';
                    }
                });
            } else {
                document.getElementById('mobile-controls').style.display = 'block';
                
                const btnAction = document.getElementById('btn-action-mode');
                btnAction.addEventListener('touchstart', (e) => {
                    e.preventDefault(); e.stopPropagation();
                    mobileActionMode = mobileActionMode === 'break' ? 'place' : 'break';
                    btnAction.innerHTML = mobileActionMode === 'break' ? '⚒️ Ломать' : '🧱 Ставить';
                });
                document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                    e.preventDefault(); e.stopPropagation(); if (canJump && !isDead) { velocity.y = 11; canJump = false; }
                });

                // Левый Джойстик (Ходьба)
                const joyBase = document.getElementById('joystick-base');
                const joyKnob = document.getElementById('joystick-knob');
                let leftTouchId = null, joyCenter = {x:0, y:0};

                document.getElementById('touch-left').addEventListener('touchstart', (e) => {
                    e.preventDefault(); let t = e.changedTouches[0]; leftTouchId = t.identifier;
                    joyBase.style.display = 'flex'; joyBase.style.left = (t.clientX - 60) + 'px'; joyBase.style.top = (t.clientY - 60) + 'px';
                    joyCenter = { x: t.clientX, y: t.clientY };
                });
                document.getElementById('touch-left').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        let t = e.changedTouches[i];
                        if(t.identifier === leftTouchId) {
                            let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
                            let dist = Math.min(50, Math.sqrt(dx*dx + dy*dy)), angle = Math.atan2(dy, dx);
                            joyKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                            moveState.right = Math.max(-1, Math.min(1, dx / 40));
                            moveState.forward = Math.max(-1, Math.min(1, -dy / 40)); 
                        }
                    }
                });
                const resetLeftJoy = (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === leftTouchId) {
                            leftTouchId = null; moveState.forward = 0; moveState.right = 0;
                            joyBase.style.display = 'none'; joyKnob.style.transform = 'translate(0,0)';
                        }
                    }
                };
                document.getElementById('touch-left').addEventListener('touchend', resetLeftJoy);
                document.getElementById('touch-left').addEventListener('touchcancel', resetLeftJoy);

                // Правая зона (Осмотр + Клик)
                let rightTouchId = null, lastRight = {x:0, y:0}, isDragging = false, touchStartTime = 0;
                document.getElementById('touch-right').addEventListener('touchstart', (e) => {
                    e.preventDefault(); let t = e.changedTouches[0];
                    rightTouchId = t.identifier; lastRight = {x: t.clientX, y: t.clientY};
                    isDragging = false; touchStartTime = Date.now();
                });
                document.getElementById('touch-right').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        let t = e.changedTouches[i];
                        if(t.identifier === rightTouchId) {
                            let dx = t.clientX - lastRight.x, dy = t.clientY - lastRight.y;
                            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
                            if(!isDead && !isInvOpen) {
                                euler.setFromQuaternion(camera.quaternion);
                                euler.y -= dx * 0.005; euler.x -= dy * 0.005;
                                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                                camera.quaternion.setFromEuler(euler);
                            }
                            lastRight = {x: t.clientX, y: t.clientY};
                        }
                    }
                });
                document.getElementById('touch-right').addEventListener('touchend', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === rightTouchId) {
                            rightTouchId = null;
                            if (!isDragging && (Date.now() - touchStartTime < 300)) interact(mobileActionMode === 'place');
                        }
                    }
                });
            }
        }

        // ==========================================
        // 5. ИГРОВОЙ ЦИКЛ
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Обработка очереди чанков (Плавная генерация)
            let chunksProcessed = 0;
            while(chunkQueue.length > 0 && chunksProcessed < 2) {
                let chunk = chunkQueue.shift();
                generateChunk(chunk.cx, chunk.cz);
                chunksProcessed++;
            }

            if ((isPointerLocked || isMobile) && !isDead && !isInvOpen) {
                const time = performance.now();
                let delta = Math.min((time - prevTime) / 1000, 0.05); 

                fallVelocityTracker = velocity.y; // Запоминаем скорость до гравитации

                velocity.x -= velocity.x * 12.0 * delta;
                velocity.z -= velocity.z * 12.0 * delta;
                velocity.y -= 9.8 * 3.5 * delta; // Гравитация

                let dir = new THREE.Vector3(moveState.right, 0, -moveState.forward);
                dir.applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();

                const speed = 45.0;
                let speedMult = Math.max(Math.abs(moveState.forward), Math.abs(moveState.right));
                if (speedMult === 0 && !isMobile) speedMult = (moveState.forward !== 0 || moveState.right !== 0) ? 1 : 0; 

                if (dir.lengthSq() > 0.01) {
                    velocity.x += dir.x * speed * speedMult * delta;
                    velocity.z += dir.z * speed * speedMult * delta;
                }

                let pos = camera.position;

                pos.x += velocity.x * delta;
                if (getCollisions(pos)) { pos.x -= velocity.x * delta; velocity.x = 0; }

                pos.z += velocity.z * delta;
                if (getCollisions(pos)) { pos.z -= velocity.z * delta; velocity.z = 0; }

                pos.y += velocity.y * delta;
                if (getCollisions(pos)) {
                    pos.y -= velocity.y * delta;
                    if (velocity.y < 0) {
                        canJump = true;
                        // Расчет урона от падения
                        if (fallVelocityTracker < -22) {
                            let dmg = Math.floor((Math.abs(fallVelocityTracker) - 20) / 4);
                            if(dmg > 0) takeDamage(dmg);
                        }
                    }
                    velocity.y = 0;
                } else {
                    canJump = false;
                }

                if (getCollisions(pos)) pos.y += 0.2; // Выталкивание
                if (pos.y < -20) takeDamage(10); // Упал в бездну = мгновенная смерть

                updateChunks(false);
                prevTime = time;
                renderer.render(scene, camera);
            } else {
                prevTime = performance.now();
                if(isDead || isInvOpen) renderer.render(scene, camera); // Продолжаем рисовать кадр
            }
        }

        window.addEventListener('resize', () => {
            if(camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // ==========================================
        // 6. СЕТЬ И МУЛЬТИПЛЕЕР
        // ==========================================
        function updateOtherPlayer(id, x, y, z, ry) {
            if (!otherPlayers.has(id)) {
                let mat = new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff });
                let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), mat);
                scene.add(mesh); otherPlayers.set(id, mesh);
            }
            let p = otherPlayers.get(id); p.position.set(x, y - 0.9, z); p.rotation.y = ry;
        }

        function sendNetData(data) { connections.forEach(conn => { if (conn && conn.open) conn.send(data); }); }

        function handleNetData(data, senderConn) {
            if (data.type === 'pos') {
                updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry);
                if (isHost) connections.forEach(c => { if (c !== senderConn && c.open) c.send(data); });
            } else if (data.type === 'block') {
                if (data.action === 'place') {
                    worldMods[`${data.x},${data.y},${data.z}`] = { action: 'place', type: data.blockType };
                    addBlock(data.x, data.y, data.z, data.blockType, false);
                }
                if (data.action === 'break') {
                    worldMods[`${data.x},${data.y},${data.z}`] = { action: 'break' };
                    removeBlock(data.x, data.y, data.z, false);
                }
                if (isHost) connections.forEach(c => { if (c !== senderConn && c.open) c.send(data); });
            } else if (data.type === 'sync_world') {
                worldMods = data.changes;
                for (let key in worldMods) {
                    let [x, y, z] = key.split(',').map(Number);
                    if (worldMods[key].action === 'place') addBlock(x, y, z, worldMods[key].type, false);
                    if (worldMods[key].action === 'break') removeBlock(x, y, z, false);
                }
            }
        }

        function setupConnectionEvents(conn) {
            conn.on('open', () => {
                document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`;
                if (isHost) conn.send({ type: 'sync_world', changes: worldMods });
            });
            conn.on('data', (data) => handleNetData(data, conn));
            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                if (otherPlayers.has(conn.peer)) { scene.remove(otherPlayers.get(conn.peer)); otherPlayers.delete(conn.peer); }
                document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`;
            });
        }

        const statusDiv = document.getElementById('status');
        
        document.getElementById('btn-single').addEventListener('click', () => {
            initEngine();
            document.getElementById('menu').style.display = 'none';
        });

        document.getElementById('btn-host').addEventListener('click', () => {
            statusDiv.innerText = 'Создание сервера...';
            peer = new Peer();
            peer.on('open', (id) => {
                isHost = true;
                document.getElementById('server-id-display').style.display = 'block';
                document.getElementById('sid-text').innerText = id;
                initEngine();
                document.getElementById('menu').style.display = 'none';
                
                setInterval(() => {
                    if (camera && peer && !peer.disconnected && !isDead) {
                        sendNetData({ type: 'pos', id: peer.id, x: camera.position.x, y: camera.position.y, z: camera.position.z, ry: euler.y });
                    }
                }, 50);
            });
            peer.on('connection', (conn) => { connections.push(conn); setupConnectionEvents(conn); });
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const hostId = document.getElementById('join-id').value.trim();
            if (!hostId) { statusDiv.innerText = 'Введи ID!'; return; }
            statusDiv.innerText = 'Подключение...';
            
            peer = new Peer();
            peer.on('open', () => {
                const conn = peer.connect(hostId);
                conn.on('open', () => { 
                    connections.push(conn); setupConnectionEvents(conn); 
                    initEngine();
                    document.getElementById('menu').style.display = 'none';
                    setInterval(() => {
                        if (camera && peer && !peer.disconnected && !isDead) {
                            sendNetData({ type: 'pos', id: peer.id, x: camera.position.x, y: camera.position.y, z: camera.position.z, ry: euler.y });
                        }
                    }, 50);
                });
                conn.on('error', () => { statusDiv.innerText = 'Ошибка подключения!'; });
            });
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
