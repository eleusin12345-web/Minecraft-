        }

        function removeBlock(x, y, z, triggerNet = false) {
            let key = `${x},${y},${z}`; let block = blockData.get(key); if (!block) return null;
            let type = block.type, index = block.index;
            let mesh = instancedMeshes[type], lastIndex = mesh.count - 1;

            if (index !== lastIndex) {
                let lastMatrix = new THREE.Matrix4(); mesh.getMatrixAt(lastIndex, lastMatrix);
                mesh.setMatrixAt(index, lastMatrix); let lastKey = blockIndexToKey[type][lastIndex];
                blockData.get(lastKey).index = index; blockIndexToKey[type][index] = lastKey;
            }
            mesh.count--; mesh.instanceMatrix.needsUpdate = true; blockData.delete(key);
            if (triggerNet) { worldMods[key] = { action: 'break' }; sendNetData({ type: 'block', action: 'break', x, y, z }); }
            
            // Логика дропа
            if (type === 3) return 10; // Камень дропает булыжник
            if (type === 5 && Math.random() < 0.05) return 109; // Листва дропает яблоко (5%)
            if (type === 5) return 0; // Иначе листва ничего не дропает
            return type;
        }

        // ==========================================
        // ГЕНЕРАЦИЯ
        // ==========================================
        function spawnTree(x, y, z) {
            for(let i=0; i<4; i++) addBlock(x, y+i, z, 4); 
            for(let dx=-2; dx<=2; dx++) for(let dz=-2; dz<=2; dz++) for(let dy=3; dy<=5; dy++) 
                if (Math.abs(dx)+Math.abs(dz) < 4) addBlock(x+dx, y+dy, z+dz, 5); 
        }

        function generateChunk(cx, cz) {
            let key = `${cx},${cz}`; if (chunks.has(key)) return; chunks.set(key, true);

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    let wx = cx * CHUNK_SIZE + x, wz = cz * CHUNK_SIZE + z;
                    let h = Math.floor(simplex.noise2D(wx / 40, wz / 40) * 8) + 15; 
                    
                    if (Math.random() < 0.05 && simplex.noise2D(wx/20, wz/20) > 0.6) addBlock(wx, 40, wz, 9);
                    
                    for (let y = 0; y <= Math.max(h, WATER_LEVEL); y++) {
                        let bKey = `${wx},${y},${wz}`;
                        if (worldMods[bKey] && worldMods[bKey].action === 'break') continue;
                        if (worldMods[bKey] && worldMods[bKey].action === 'place') { addBlock(wx, y, wz, worldMods[bKey].type); continue; }
                        if (y < h - 2 && y > 2 && simplex3D.noise3D(wx/15, y/15, wz/15) > 0.4) continue; 
                        
                        let type = 3; 
                        if (y === h && y >= WATER_LEVEL) type = 1; else if (y < h && y > h - 3) type = 2; 
                        else if (y > h && y <= WATER_LEVEL) type = 7; else if (y < h - 3 && Math.random() < 0.03) type = 8; 
                        addBlock(wx, y, wz, type);
                    }
                    if (h >= WATER_LEVEL && Math.random() < 0.01 && !worldMods[`${wx},${h+1},${wz}`]) spawnTree(wx, h+1, wz);
                    
                    // Мобы в одиночке и на хосте
                    if (h >= WATER_LEVEL && Math.random() < 0.005 && mobs.length < 25) spawnMob(wx, h+1, wz, Math.random() > 0.5 ? 1 : 2);
                }
            }
        }

        function updateChunks(forceSync = false) {
            let px = Math.floor(camera.position.x / CHUNK_SIZE), pz = Math.floor(camera.position.z / CHUNK_SIZE);
            for (let cx = px - VIEW_DISTANCE; cx <= px + VIEW_DISTANCE; cx++) {
                for (let cz = pz - VIEW_DISTANCE; cz <= pz + VIEW_DISTANCE; cz++) {
                    if (!chunks.has(`${cx},${cz}`) && !chunkQueue.some(q => q.cx===cx && q.cz===cz)) {
                        if (forceSync) generateChunk(cx, cz); else chunkQueue.push({cx, cz});
                    }
                }
            }
        }

        // ==========================================
        // ДРОПЫ И МОБЫ
        // ==========================================
        function spawnDrop(x, y, z, id, count=1) {
            if (!id || id===7 || id===9) return; 
            let color = 0xffffff;
            if(id===1) color=0x559c3f; if(id===2) color=0x7a5c3d; if(id===3) color=0x888888;
            if(id===4) color=0x5c4033; if(id===6) color=0xcda26f; if(id===8) color=0x777777;
            if(id===10) color=0x666666; if(id===102) color=0xffaaaa; if(id===103) color=0xeeeeee;
            if(id===109) color=0xff3333; // Яблоко
            
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({color: color, roughness:0.8}));
            mesh.position.set(x, y, z); mesh.castShadow = true; scene.add(mesh);
            drops.push({ mesh: mesh, id: id, count: count, ry: 0 });
        }

        function spawnMob(x, y, z, type=1) { 
            let color = type === 1 ? 0xeeeeee : 0xffaadd;
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({color: color}));
            mesh.position.set(x, y, z); mesh.castShadow = true; scene.add(mesh);
            let mob = { id: Math.random().toString(36).substr(2, 9), mesh: mesh, type: type, vx: 0, vy: 0, vz: 0, hp: 5, rx: x, ry: y, rz: z, nextMove: 0 };
            mobs.push(mob);
            if(isHost) sendNetData({ type: 'mob_spawn', mob: { id: mob.id, x, y, z, type } });
        }

        function updateMobs() { 
            let now = performance.now();
            mobs.forEach(mob => {
                if (now > mob.nextMove) {
                    let angle = Math.random() * Math.PI * 2; let speed = Math.random() > 0.4 ? 1.5 : 0;
                    mob.vx = Math.cos(angle) * speed; mob.vz = Math.sin(angle) * speed;
                    if(Math.random() > 0.7 && blockData.has(`${Math.round(mob.rx)},${Math.round(mob.ry-1)},${Math.round(mob.rz)}`)) mob.vy = 5;
                    mob.nextMove = now + 1000 + Math.random() * 2000;
                }
            });
        }

        // ==========================================
        // ИНВЕНТАРЬ И UI
        // ==========================================
        function toggleInvMode() {
            let btn = document.getElementById('inv-mode-btn');
            if (invMode === 'all') { invMode = 'half'; btn.innerText = 'Режим: ВЗЯТЬ ПОЛОВИНУ'; btn.style.color = '#ffaa00'; }
            else if (invMode === 'half') { invMode = 'one'; btn.innerText = 'Режим: БРАТЬ ПО ОДНОМУ'; btn.style.color = '#ff4444'; }
            else { invMode = 'all'; btn.innerText = 'Режим: ПЕРЕМЕСТИТЬ ВСЁ'; btn.style.color = '#0f0'; }
        }

        function buildInventoryHTML() {
            let main = document.getElementById('inv-main'), hb = document.getElementById('inv-hotbar'), hudHb = document.getElementById('hotbar');
            for(let i=0; i<3; i++) {
                let row = document.createElement('div'); row.className = 'inv-row';
                for(let j=0; j<9; j++) {
                    let idx = i*9 + j; row.innerHTML += `<div class="slot inv-slot" data-type="main" data-idx="${idx}"></div>`;
                } main.appendChild(row);
            }
            for(let i=0; i<9; i++) {
                hb.innerHTML += `<div class="slot inv-slot" data-type="hotbar" data-idx="${i}"></div>`;
                hudHb.innerHTML += `<div class="slot" id="hud-slot-${i}" onclick="selectHotbarSlot(${i})"></div>`;
            } selectHotbarSlot(0);
            
            document.querySelectorAll('.inv-slot').forEach(slot => {
                slot.addEventListener('mousedown', (e) => handleInvClick(e, slot));
                slot.addEventListener('touchstart', (e) => { e.preventDefault(); handleInvClick(e, slot); });
            });
        }

        function renderInventory() {
            const drawSlot = (el, item) => {
                if(item) {
                    let cCls = (item.id>100 && item.id<110 && item.id!==102 && item.id!==103 && item.id!==109) ? 'icon-'+item.id : `icon-${item.id}`; // Инструменты
                    el.innerHTML = `<div class="item-icon ${cCls}"></div><div class="item-count">${item.count>1?item.count:''}</div>`;
                } else el.innerHTML = '';
            };
            document.querySelectorAll('.inv-slot').forEach(el => {
                let type = el.dataset.type, idx = parseInt(el.dataset.idx);
                if(type === 'main') drawSlot(el, inventory[idx]);
                if(type === 'hotbar') drawSlot(el, hotbar[idx]);
                if(type === 'craft') drawSlot(el, craftGrid[idx]);
                if(type === 'craftOut') drawSlot(el, craftResult);
            });
            for(let i=0; i<9; i++) drawSlot(document.getElementById(`hud-slot-${i}`), hotbar[i]);

            let cursorEl = document.getElementById('cursor-item');
            if(cursorItem) {
                cursorEl.style.display = 'block'; document.getElementById('cursor-icon').className = `item-icon icon-${cursorItem.id}`;
                document.getElementById('cursor-count').innerText = cursorItem.count > 1 ? cursorItem.count : '';
            } else cursorEl.style.display = 'none';
        }

        function checkCrafting() {
            craftResult = null; let currentIn = craftGrid.map(i => i ? i.id : 0);
            for (let r of RECIPES) if (r.in.join(',') === currentIn.join(',')) { craftResult = { id: r.out.id, count: r.out.count }; break; }
        }

        function handleInvClick(e, slotEl) {
            let type = slotEl.dataset.type, idx = parseInt(slotEl.dataset.idx);
            let targetArr = type==='main' ? inventory : (type==='hotbar' ? hotbar : (type==='craft' ? craftGrid : null));
            
            // Если правый клик мышью - принудительно режим 'half' или 'one'
            let isRightClick = (e.button === 2);
            let currentMode = isRightClick ? 'half' : invMode;
            
            // Если крафт
            if (type === 'craftOut' && craftResult) {
                if (!cursorItem || (cursorItem.id === craftResult.id && cursorItem.count + craftResult.count <= 64)) {
                    if(!cursorItem) cursorItem = { id: craftResult.id, count: craftResult.count }; else cursorItem.count += craftResult.count;
                    for(let i=0; i<4; i++) { if(craftGrid[i]) { craftGrid[i].count--; if(craftGrid[i].count<=0) craftGrid[i]=null; } }
                    checkCrafting(); renderInventory();
                } return;
            }
            if (!targetArr) return;
            let clickedItem = targetArr[idx];

            if (cursorItem) {
                // Если держим предмет
                if (!clickedItem) {
                    if (currentMode === 'one') {
                        targetArr[idx] = { id: cursorItem.id, count: 1 };
                        cursorItem.count--; if(cursorItem.count <= 0) cursorItem = null;
                    } else { targetArr[idx] = cursorItem; cursorItem = null; }
                } else if (clickedItem.id === cursorItem.id) {
                    if (currentMode === 'one') {
                        if(clickedItem.count < 64) { clickedItem.count++; cursorItem.count--; if(cursorItem.count<=0) cursorItem = null; }
                    } else {
                        let space = 64 - clickedItem.count, toAdd = Math.min(space, cursorItem.count);
                        clickedItem.count += toAdd; cursorItem.count -= toAdd; if(cursorItem.count <= 0) cursorItem = null;
                    }
                } else {
                    if(currentMode === 'all') { targetArr[idx] = cursorItem; cursorItem = clickedItem; }
                }
            } else if (clickedItem) {
                // Если рука пустая
                if (currentMode === 'half') {
                    let half = Math.ceil(clickedItem.count / 2); cursorItem = { id: clickedItem.id, count: half };
                    clickedItem.count -= half; if(clickedItem.count <= 0) targetArr[idx] = null;
                } else if (currentMode === 'one') {
                    cursorItem = { id: clickedItem.id, count: 1 };
                    clickedItem.count--; if(clickedItem.count <= 0) targetArr[idx] = null;
                } else { cursorItem = clickedItem; targetArr[idx] = null; }
            }
            if(type === 'craft') checkCrafting(); renderInventory();
        }

        function selectHotbarSlot(idx) {
            activeHotbarSlot = idx;
            for(let i=0; i<9; i++) document.getElementById(`hud-slot-${i}`).classList.remove('active');
            document.getElementById(`hud-slot-${idx}`).classList.add('active');
        }

        function giveItem(id, count) {
            for(let i=0; i<HOTBAR_SIZE; i++) { if(hotbar[i] && hotbar[i].id === id && hotbar[i].count < 64) { let s = 64 - hotbar[i].count; let add = Math.min(s, count); hotbar[i].count += add; count -= add; if(count<=0){ renderInventory(); return;} } }
            for(let i=0; i<INV_SIZE; i++) { if(inventory[i] && inventory[i].id === id && inventory[i].count < 64) { let s = 64 - inventory[i].count; let add = Math.min(s, count); inventory[i].count += add; count -= add; if(count<=0){ renderInventory(); return;} } }
            for(let i=0; i<HOTBAR_SIZE; i++) { if(!hotbar[i]) { hotbar[i] = {id, count}; renderInventory(); return; } }
            for(let i=0; i<INV_SIZE; i++) { if(!inventory[i]) { inventory[i] = {id, count}; renderInventory(); return; } }
        }
        
        function eatFood() {
            let item = hotbar[activeHotbarSlot];
            if (item && (item.id === 102 || item.id === 109) && health < 10) {
                health = Math.min(10, health + (item.id===109 ? 3 : 2)); // Яблоко = 3, Мясо = 2
                item.count--; if(item.count <= 0) hotbar[activeHotbarSlot] = null;
                updateHeartsUI(); renderInventory();
            }
        }

        // ==========================================
        // ЛОГИКА ИГРЫ И УПРАВЛЕНИЕ
        // ==========================================
        function updateHeartsUI() {
            let hContainer = document.getElementById('hearts-container'); hContainer.innerHTML = '';
            for(let i = 0; i < 10; i++) hContainer.innerHTML += `<div class="heart">${i < health ? '❤️' : '🖤'}</div>`;
        }
        function takeDamage(amount) {
            if(isDead) return; health = Math.max(0, health - amount); updateHeartsUI();
            camera.position.y -= 0.3; 
            if(health === 0) { isDead = true; document.exitPointerLock(); document.getElementById('death-screen').style.display = 'flex'; document.getElementById('ui-layer').style.display = 'none'; }
        }
        function respawnPlayer() {
            isDead = false; health = 10; camera.position.set(8, 25, 8); velocity.set(0,0,0);
            updateHeartsUI(); document.getElementById('death-screen').style.display = 'none'; document.getElementById('ui-layer').style.display = 'block';
            if(!isMobile) document.body.requestPointerLock();
        }

        function getCollisions(pos) {
            let minX = Math.round(pos.x - 0.25), maxX = Math.round(pos.x + 0.25), minY = Math.round(pos.y - 1.6), maxY = Math.round(pos.y + 0.1), minZ = Math.round(pos.z - 0.25), maxZ = Math.round(pos.z + 0.25);
            inWater = false;
            for (let x = minX; x <= maxX; x++) for (let y = minY; y <= maxY; y++) for (let z = minZ; z <= maxZ; z++) {
                let b = blockData.get(`${x},${y},${z}`);
                if (b) { if(b.type === 7) inWater = true; else if(b.type !== 9) return true; }
            }
            return false;
        }

        function getRaycastHit() {
            let pos = camera.position.clone(), dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.normalize();
            let step = 0.1, dist = 0, lastPos = null;
            while (dist < 6) {
                pos.addScaledVector(dir, step); dist += step;
                let bx = Math.round(pos.x), by = Math.round(pos.y), bz = Math.round(pos.z);
                
                for(let m of mobs) if(Math.abs(m.mesh.position.x - pos.x)<0.7 && Math.abs(m.mesh.position.y - pos.y)<0.7 && Math.abs(m.mesh.position.z - pos.z)<0.7) return { type: 'mob', mob: m };
                let b = blockData.get(`${bx},${by},${bz}`);
                if (b && b.type !== 7 && b.type !== 9) return { type: 'block', key: `${bx},${by},${bz}`, bx, by, bz, blockType: b.type, lastPos }; 
                lastPos = { x: bx, y: by, z: bz };
            }
            return null;
        }

        function processAction(isPlace) {
            if(isDead || isInvOpen) return;
            let activeItem = hotbar[activeHotbarSlot];
            
            // Попытка съесть еду
            if (isPlace && activeItem && (activeItem.id === 102 || activeItem.id === 109)) { eatFood(); return; }

            let hit = getRaycastHit(); if(!hit) return;

            if(isPlace) {
                if(hit.type === 'block' && hit.lastPos && activeItem && activeItem.id < 100) { 
                    addBlock(hit.lastPos.x, hit.lastPos.y, hit.lastPos.z, activeItem.id, true);
                    activeItem.count--; if(activeItem.count <= 0) hotbar[activeHotbarSlot] = null;
                    renderInventory();
                }
            } else {
                if(hit.type === 'mob') {
                    let toolId = hotbar[activeHotbarSlot] ? hotbar[activeHotbarSlot].id : 0;
                    hit.mob.hp -= getWeaponDamage(toolId); 
                    hit.mob.vy = 4; hit.mob.vx = (hit.mob.rx - camera.position.x)*3; hit.mob.vz = (hit.mob.rz - camera.position.z)*3;
                    
                    if(hit.mob.hp <= 0) {
                        scene.remove(hit.mob.mesh); mobs = mobs.filter(m => m !== hit.mob);
                        spawnDrop(hit.mob.rx, hit.mob.ry, hit.mob.rz, hit.mob.type===1 ? 103 : 102, 1); 
                        if(isHost) sendNetData({type: 'mob_die', id: hit.mob.id});
                    }
                    isMining = false; miningBlock = null;
                }
            }
        }

        function toggleInventory() {
            if(isDead) return; isInvOpen = !isInvOpen;
            let inv = document.getElementById('inventory-ui');
            if (isInvOpen) {
                document.exitPointerLock(); inv.style.display = 'flex';
                if(isMobile) document.getElementById('mobile-controls').style.display = 'none';
            } else {
                inv.style.display = 'none';
                if(cursorItem) { giveItem(cursorItem.id, cursorItem.count); cursorItem = null; renderInventory(); } 
                if(!isMobile) document.body.requestPointerLock();
                if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
            }
        }

        function setupControls() {
            document.addEventListener('mousemove', (e) => { if(isInvOpen && cursorItem) { let c = document.getElementById('cursor-item'); c.style.left = e.clientX - 25 + 'px'; c.style.top = e.clientY - 25 + 'px'; }});
            // Блокируем контекстное меню для ПКМ
            document.addEventListener('contextmenu', e => e.preventDefault());

            if (!isMobile) {
                document.addEventListener('keydown', (e) => {
                    if (isDead) return;
                    if (e.code === 'KeyW') moveState.forward = 1; if (e.code === 'KeyS') moveState.forward = -1;
                    if (e.code === 'KeyA') moveState.right = -1; if (e.code === 'KeyD') moveState.right = 1;
                    if (e.code === 'Space' && (canJump || inWater)) { velocity.y = inWater ? 5 : 9; canJump = false; }
                    if (e.code >= 'Digit1' && e.code <= 'Digit9') selectHotbarSlot(parseInt(e.key)-1);
                    if (e.code === 'KeyE') toggleInventory();
                });
                document.addEventListener('keyup', (e) => {
                    if (e.code === 'KeyW' || e.code === 'KeyS') moveState.forward = 0;
                    if (e.code === 'KeyA' || e.code === 'KeyD') moveState.right = 0;
                });
                document.addEventListener('mousedown', (e) => {
                    if (isDead || document.getElementById('menu').style.display !== 'none' || isInvOpen) return;
                    if (!isPointerLocked) document.body.requestPointerLock();
                    else { if (e.button === 0) { isMining = true; processAction(false); } if (e.button === 2) processAction(true); }
                });
                document.addEventListener('mouseup', (e) => { if (e.button === 0) { isMining = false; miningBlock = null; } });
                document.addEventListener('mousemove', (e) => {
                    if (isPointerLocked && !isDead) { euler.setFromQuaternion(camera.quaternion); euler.y -= e.movementX * 0.002; euler.x -= e.movementY * 0.002; euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x)); camera.quaternion.setFromEuler(euler); }
                });
            } else {
                document.getElementById('mobile-controls').style.display = 'block';
                document.getElementById('btn-inv-mobile').addEventListener('touchstart', (e)=>{ e.preventDefault(); toggleInventory(); });
                
                document.getElementById('btn-mine').addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); isMining = true; processAction(false); });
                document.getElementById('btn-mine').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); isMining = false; miningBlock = null; });
                document.getElementById('btn-place').addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); processAction(true); });
                
                document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); if (canJump || inWater) { velocity.y = inWater?5:9; canJump = false; }});

                let rightTouchId = null, lastRight = {x:0, y:0};
                document.getElementById('touch-right').addEventListener('touchstart', (e) => { e.preventDefault(); rightTouchId = e.changedTouches[0].identifier; lastRight = {x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY}; });
                document.getElementById('touch-right').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === rightTouchId && !isDead && !isInvOpen) {
                            let dx = e.changedTouches[i].clientX - lastRight.x, dy = e.changedTouches[i].clientY - lastRight.y;
                            euler.setFromQuaternion(camera.quaternion); euler.y -= dx * 0.005; euler.x -= dy * 0.005; euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x)); camera.quaternion.setFromEuler(euler);
                            lastRight = {x: e.changedTouches[i].clientX, y: e.changedTouches[i].clientY};
                        }
                    }
                });
                document.getElementById('touch-right').addEventListener('touchend', (e) => { e.preventDefault(); for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === rightTouchId) rightTouchId = null; });
                
                const joyBase = document.getElementById('joystick-base'), joyKnob = document.getElementById('joystick-knob');
                let leftTouchId = null, joyCenter = {x:0, y:0};
                document.getElementById('touch-left').addEventListener('touchstart', (e) => {
                    e.preventDefault(); leftTouchId = e.changedTouches[0].identifier;
                    joyBase.style.display = 'flex'; joyBase.style.left = (e.changedTouches[0].clientX - 65) + 'px'; joyBase.style.top = (e.changedTouches[0].clientY - 65) + 'px'; joyCenter = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                });
                document.getElementById('touch-left').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === leftTouchId) {
                            let dx = e.changedTouches[i].clientX - joyCenter.x, dy = e.changedTouches[i].clientY - joyCenter.y;
                            let dist = Math.min(50, Math.sqrt(dx*dx + dy*dy)), angle = Math.atan2(dy, dx);
                            joyKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                            moveState.right = Math.max(-1, Math.min(1, dx / 40)); moveState.forward = Math.max(-1, Math.min(1, -dy / 40)); 
                        }
                    }
                });
                const resetLeftJoy = (e) => { e.preventDefault(); for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === leftTouchId) { leftTouchId = null; moveState.forward = 0; moveState.right = 0; joyBase.style.display = 'none'; joyKnob.style.transform = 'translate(0,0)'; } };
                document.getElementById('touch-left').addEventListener('touchend', resetLeftJoy);
            }
        }

        // ==========================================
        // ИГРОВОЙ ЦИКЛ И ФИЗИКА
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            let chunksProcessed = 0; while(chunkQueue.length > 0 && chunksProcessed < 2) { let chunk = chunkQueue.shift(); generateChunk(chunk.cx, chunk.cz); chunksProcessed++; }

            const time = performance.now(); let delta = Math.min((time - prevTime) / 1000, 0.05); 
            
            if (camera && dirLight) {
                dirLight.position.set(Math.floor(camera.position.x) + 20, Math.floor(camera.position.y) + 30, Math.floor(camera.position.z) + 10);
                dirLight.target.position.copy(camera.position); dirLight.target.updateMatrixWorld();
            }

            drops.forEach((d, idx) => {
                d.ry += delta * 2; d.mesh.rotation.y = d.ry; d.mesh.position.y += Math.sin(time*0.005) * 0.005; 
                if(camera.position.distanceTo(d.mesh.position) < 2.5) { giveItem(d.id, d.count); scene.remove(d.mesh); drops.splice(idx, 1); }
            });
            mobs.forEach(m => { 
                m.vy -= 9.8 * delta; m.rx += m.vx * delta; m.ry += m.vy * delta; m.rz += m.vz * delta;
                if(blockData.has(`${Math.round(m.rx)},${Math.round(m.ry-1)},${Math.round(m.rz)}`)) { m.ry = Math.round(m.ry); m.vy = 0; }
                m.mesh.position.set(m.rx, m.ry, m.rz);
            });

            if ((isPointerLocked || isMobile) && !isDead && !isInvOpen) {
                let pBar = document.getElementById('break-progress-container'), pFill = document.getElementById('break-progress-bar');
                if (isMining) {
                    let hit = getRaycastHit();
                    if (hit && hit.type === 'block') {
                        if (miningBlock !== hit.key) { miningBlock = hit.key; mineProgress = 0; } 
                        else {
                            pBar.style.display = 'block';
                            let toolId = hotbar[activeHotbarSlot] ? hotbar[activeHotbarSlot].id : 0;
                            mineProgress += delta * getMineSpeed(hit.blockType, toolId);
                            pFill.style.width = Math.min(mineProgress * 100, 100) + '%';
                            
                            if (mineProgress >= 1) {
                                let droppedType = removeBlock(hit.bx, hit.by, hit.bz, true);
                                spawnDrop(hit.bx, hit.by, hit.bz, droppedType);
                                miningBlock = null; mineProgress = 0; pBar.style.display = 'none'; 
                            }
                        }
                    } else { miningBlock = null; mineProgress = 0; pBar.style.display = 'none'; }
                } else { miningBlock = null; mineProgress = 0; pBar.style.display = 'none'; }

                fallVelocityTracker = velocity.y;
                let drag = inWater ? 4.0 : 12.0, grav = inWater ? 4.0 : 35.0; 
                velocity.x -= velocity.x * drag * delta; velocity.z -= velocity.z * drag * delta; velocity.y -= grav * delta; 

                let dir = new THREE.Vector3(moveState.right, 0, -moveState.forward);
                dir.applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();

                let speed = inWater ? 12.0 : 45.0, speedMult = Math.max(Math.abs(moveState.forward), Math.abs(moveState.right));
                if (speedMult === 0 && !isMobile) speedMult = (moveState.forward !== 0 || moveState.right !== 0) ? 1 : 0; 
                if (dir.lengthSq() > 0.01) { velocity.x += dir.x * speed * speedMult * delta; velocity.z += dir.z * speed * speedMult * delta; }

                let pos = camera.position;
                pos.x += velocity.x * delta; if (getCollisions(pos)) { pos.x -= velocity.x * delta; velocity.x = 0; }
                pos.z += velocity.z * delta; if (getCollisions(pos)) { pos.z -= velocity.z * delta; velocity.z = 0; }
                pos.y += velocity.y * delta;
                if (getCollisions(pos)) {
                    pos.y -= velocity.y * delta;
                    if (velocity.y < 0) {
                        canJump = true;
                        if (fallVelocityTracker < -22 && !inWater) { let dmg = Math.floor((Math.abs(fallVelocityTracker) - 20) / 4); if(dmg > 0) takeDamage(dmg); }
                    }
                    velocity.y = 0;
                } else canJump = false;

                if (getCollisions(pos)) pos.y += 0.2; 
                if (pos.y < -5) takeDamage(10); 
                updateChunks(false);
            }
            prevTime = time; renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { if(camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }});

        // ==========================================
        // СЕТЬ
        // ==========================================
        function updateOtherPlayer(id, x, y, z, ry) {
            if (!otherPlayers.has(id)) { let m = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), new THREE.MeshStandardMaterial({color: Math.random()*0xffffff})); m.castShadow=true; scene.add(m); otherPlayers.set(id, m); }
            let p = otherPlayers.get(id); p.position.set(x, y - 0.9, z); p.rotation.y = ry;
        }
        function sendNetData(data) { connections.forEach(conn => { if (conn && conn.open) conn.send(data); }); }
        function handleNetData(data, senderConn) {
            if (data.type === 'pos') { updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry); if (isHost) sendNetData(data); }
            else if (data.type === 'block') {
                if (data.action === 'place') { worldMods[`${data.x},${data.y},${data.z}`] = {action: 'place', type: data.blockType}; addBlock(data.x, data.y, data.z, data.blockType, false); }
                if (data.action === 'break') { worldMods[`${data.x},${data.y},${data.z}`] = {action: 'break'}; removeBlock(data.x, data.y, data.z, false); }
                if (isHost) sendNetData(data);
            }
            else if (data.type === 'sync_world') {
                worldMods = data.changes;
                for (let key in worldMods) { let [x, y, z] = key.split(',').map(Number); if (worldMods[key].action === 'place') addBlock(x, y, z, worldMods[key].type, false); if (worldMods[key].action === 'break') removeBlock(x, y, z, false); }
            }
            else if (data.type === 'mob_spawn') { spawnMob(data.mob.x, data.mob.y, data.mob.z, data.mob.type); mobs[mobs.length-1].id = data.mob.id; }
            else if (data.type === 'mob_die') { let m = mobs.find(x=>x.id===data.id); if(m){ scene.remove(m.mesh); mobs = mobs.filter(x=>x!==m); } }
        }
        function setupConnectionEvents(conn) {
            conn.on('open', () => { document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`; if (isHost) conn.send({ type: 'sync_world', changes: worldMods }); });
            conn.on('data', (data) => handleNetData(data, conn));
            conn.on('close', () => { connections = connections.filter(c => c !== conn); if (otherPlayers.has(conn.peer)) { scene.remove(otherPlayers.get(conn.peer)); otherPlayers.delete(conn.peer); } document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`; });
        }

        const statusDiv = document.getElementById('status');
        document.getElementById('btn-single').addEventListener('click', () => { isHost = true; initEngine(); document.getElementById('menu').style.display = 'none'; });
        document.getElementById('btn-host').addEventListener('click', () => {
            statusDiv.innerText = 'Создание...'; peer = new Peer();
            peer.on('open', (id) => {
                isHost = true; document.getElementById('server-id-display').style.display = 'block'; document.getElementById('sid-text').innerText = id;
                initEngine(); document.getElementById('menu').style.display = 'none';
                setInterval(() => { if (camera && !isDead) sendNetData({ type: 'pos', id: peer.id, x: camera.position.x, y: camera.position.y, z: camera.position.z, ry: euler.y }); }, 50);
            });
            peer.on('connection', (conn) => { connections.push(conn); setupConnectionEvents(conn); });
        });
        document.getElementById('btn-join').addEventListener('click', () => {
            const hostId = document.getElementById('join-id').value.trim(); if (!hostId) return; statusDiv.innerText = 'Подключение...';
            peer = new Peer();
            peer.on('open', () => {
                const conn = peer.connect(hostId);
                conn.on('open', () => { connections.push(conn); setupConnectionEvents(conn); initEngine(); document.getElementById('menu').style.display = 'none';
                setInterval(() => { if (camera && !isDead) sendNetData({ type: 'pos', id: peer.id, x: camera.position.x, y: camera.position.y, z: camera.position.z, ry: euler.y }); }, 50); });
                conn.on('error', () => { statusDiv.innerText = 'Ошибка: Проверьте ID'; });
            });
        });
