<body>

    <!-- Заглушка для портретного режима -->

    <!-- Главное меню -->
    <div id="menu">
        <h1>WebCraft</h1>
        <p class="subtitle">ПК: WASD + Мышь. Тел: Сенсорный экран</p>
        
        <button class="menu-btn" id="btn-single">Одиночная игра</button>
        <button class="menu-btn" id="btn-host">Создать сервер (Host)</button>
        
        <div style="width: 100%; max-width: 400px; border-top: 2px dashed #555; padding-top: 15px; margin-top: 10px; text-align: center;">

            <div class="slot block-1 active" id="slot-1" onclick="selectBlock(1)">1</div>

            <div class="slot block-3" id="slot-3" onclick="selectBlock(3)">3</div>
            <div class="slot block-4" id="slot-4" onclick="selectBlock(4)">4</div>
            <div class="slot block-5" id="slot-5" onclick="selectBlock(5)">5</div>
        </div>
    </div>

    <!-- Мобильное управление -->
    <div id="mobile-controls">
        <div class="touch-zone" id="touch-left"></div>
        <div class="touch-zone" id="touch-right"></div>
        <div class="btn-mobile" id="btn-jump">⬆️</div>
        <div class="btn-mobile" id="btn-action-mode">⚒️ Ломать</div>
    </div>

    <script>
        // ==========================================
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ДВИЖОК
        // ==========================================
        let camera, scene, renderer;
        let blocks = new Map();
        let chunks = new Map();
        
        // Хранилище ВСЕХ изменений мира (чтобы синхронизировать новых игроков)
        let worldMods = {}; // 'x,y,z' -> { action: 'place'/'break', type: 1 }

        const CHUNK_SIZE = 16, VIEW_DISTANCE = 2;
        const simplex = new SimplexNoise('webcraft-lan-seed'); // Одинаковый сид для всех
        
        let currentBlockType = 1;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);
        
        let moveState = { forward: 0, right: 0 };
        let canJump = false;
        let velocity = new THREE.Vector3();
        let prevTime = performance.now();
        
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let isPointerLocked = false;
        let gameStarted = false;

        // Сеть
        let peer, connections = [], otherPlayers = new Map(), isHost = false;
        let mobileActionMode = 'break'; 

        function initEngine() {
            if (gameStarted) return; // Защита от двойного запуска
            gameStarted = true;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, (VIEW_DISTANCE * CHUNK_SIZE) - 5);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 30, 8);

            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(100, 200, 50);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            updateChunks();
            setupControls();
            requestAnimationFrame(animate);
        }

        // ==========================================
        // БЛОКИ И ГЕНЕРАЦИЯ (С УЧЕТОМ МУЛЬТИПЛЕЕРА)
        // ==========================================
        function getMaterial(colorHex, isGrass = false) {
            if (isGrass) {
                return [
                    new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
                    new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
                    new THREE.MeshLambertMaterial({ color: 0x228B22 }),
                    new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
                    new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
                    new THREE.MeshLambertMaterial({ color: 0x8B4513 })
                ];
            }
            return new THREE.MeshLambertMaterial({ color: colorHex });
        }

        const materials = {
            1: getMaterial(0x228B22, true), 2: getMaterial(0x8B4513),
            3: getMaterial(0x808080), 4: getMaterial(0x654321), 5: getMaterial(0xffd700)
        };
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);

        function addBlock(x, y, z, type, triggerNet = false) {
            let key = `${x},${y},${z}`;
            if (blocks.has(key)) return;
            
            let mesh = new THREE.Mesh(blockGeo, materials[type]);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.set(key, { mesh, type });
            
            if (triggerNet) {
                worldMods[key] = { action: 'place', type: type };
                sendNetData({ type: 'block', action: 'place', x, y, z, blockType: type });
            }
        }

        function removeBlock(x, y, z, triggerNet = false) {
            let key = `${x},${y},${z}`;
            if (blocks.has(key)) {
                scene.remove(blocks.get(key).mesh);
                blocks.delete(key);
                
                if (triggerNet) {
                    worldMods[key] = { action: 'break' };
                    sendNetData({ type: 'block', action: 'break', x, y, z });
                }
            }
        }

        function generateChunk(cx, cz) {
            let key = `${cx},${cz}`;
            if (chunks.has(key)) return;
            chunks.set(key, true);

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    let wx = cx * CHUNK_SIZE + x, wz = cz * CHUNK_SIZE + z;
                    let h = Math.floor(simplex.noise2D(wx / 30, wz / 30) * 5) + 5;
                    
                    // Проверяем, не ломали ли этот блок игроки, прежде чем генерировать
                    if (!worldMods[`${wx},${h},${wz}`] || worldMods[`${wx},${h},${wz}`].action !== 'break') 
                        addBlock(wx, h, wz, h < 4 ? 5 : 1);
                    if (!worldMods[`${wx},${h-1},${wz}`] || worldMods[`${wx},${h-1},${wz}`].action !== 'break') 
                        addBlock(wx, h - 1, wz, 2);
                    if (!worldMods[`${wx},${h-2},${wz}`] || worldMods[`${wx},${h-2},${wz}`].action !== 'break') 
                        addBlock(wx, h - 2, wz, 3);
                }
            }
        }

        function updateChunks() {
            let px = Math.floor(camera.position.x / CHUNK_SIZE);
            let pz = Math.floor(camera.position.z / CHUNK_SIZE);
            for (let cx = px - VIEW_DISTANCE; cx <= px + VIEW_DISTANCE; cx++) {
                for (let cz = pz - VIEW_DISTANCE; cz <= pz + VIEW_DISTANCE; cz++) {
                    generateChunk(cx, cz);
                }
            }
        }

        // ==========================================
        // УПРАВЛЕНИЕ И ФИЗИКА
        // ==========================================
        function setupControls() {
            if (!isMobile) {
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'KeyW') moveState.forward = 1;
                    if (e.code === 'KeyS') moveState.forward = -1;
                    if (e.code === 'KeyA') moveState.right = -1;
                    if (e.code === 'KeyD') moveState.right = 1;
                    if (e.code === 'Space' && canJump) { velocity.y = 10; canJump = false; }
                    if (e.code >= 'Digit1' && e.code <= 'Digit5') selectBlock(parseInt(e.key));
                });
                document.addEventListener('keyup', (e) => {
                    if (e.code === 'KeyW' || e.code === 'KeyS') moveState.forward = 0;
                    if (e.code === 'KeyA' || e.code === 'KeyD') moveState.right = 0;
                });
                document.addEventListener('mousedown', (e) => {
                    if (document.getElementById('menu').style.display === 'none') {
                        if (!isPointerLocked) document.body.requestPointerLock();
                        else interact(e.button === 2); 
                    }
                });
                document.addEventListener('mousemove', (e) => {
                    if (isPointerLocked) {
                        euler.setFromQuaternion(camera.quaternion);
                        euler.y -= e.movementX * 0.002;
                        euler.x -= e.movementY * 0.002;
                        euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                        camera.quaternion.setFromEuler(euler);
                    }
                });
                document.addEventListener('pointerlockchange', () => {
                    isPointerLocked = document.pointerLockElement === document.body;
                    document.getElementById('menu').style.display = isPointerLocked ? 'none' : 'flex';
                    document.getElementById('ui-layer').style.display = isPointerLocked ? 'block' : 'none';
                });
            } else {
                document.getElementById('mobile-controls').style.display = 'block';
                const btnAction = document.getElementById('btn-action-mode');
                btnAction.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (mobileActionMode === 'break') {
                        mobileActionMode = 'place'; btnAction.innerHTML = '🧱 Ставить';
                    } else {
                        mobileActionMode = 'break'; btnAction.innerHTML = '⚒️ Ломать';
                    }
                });
                document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (canJump) { velocity.y = 10; canJump = false; }
                });

                // Джойстик передвижения
                let leftTouchId = null, startLeft = { x: 0, y: 0 };
                document.getElementById('touch-left').addEventListener('touchstart', (e) => {
                    e.preventDefault(); leftTouchId = e.changedTouches[0].identifier;
                    startLeft.x = e.changedTouches[0].clientX; startLeft.y = e.changedTouches[0].clientY;
                });
                document.getElementById('touch-left').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === leftTouchId) {
                            let dx = e.changedTouches[i].clientX - startLeft.x;
                            let dy = e.changedTouches[i].clientY - startLeft.y;
                            moveState.right = Math.max(-1, Math.min(1, dx / 50));
                            moveState.forward = Math.max(-1, Math.min(1, -dy / 50)); 
                        }
                    }
                });
                document.getElementById('touch-left').addEventListener('touchend', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === leftTouchId) {
                            leftTouchId = null; moveState.forward = 0; moveState.right = 0;
                        }
                    }
                });

                // Джойстик обзора и клика
                let rightTouchId = null, lastRight = { x: 0, y: 0 }, isDragging = false;
                document.getElementById('touch-right').addEventListener('touchstart', (e) => {
                    e.preventDefault(); rightTouchId = e.changedTouches[0].identifier;
                    lastRight.x = e.changedTouches[0].clientX; lastRight.y = e.changedTouches[0].clientY;
                    isDragging = false;
                });
                document.getElementById('touch-right').addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === rightTouchId) {
                            let dx = e.changedTouches[i].clientX - lastRight.x;
                            let dy = e.changedTouches[i].clientY - lastRight.y;
                            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) isDragging = true;

                            euler.setFromQuaternion(camera.quaternion);
                            euler.y -= dx * 0.004; euler.x -= dy * 0.004;
                            euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                            camera.quaternion.setFromEuler(euler);
                            lastRight.x = e.changedTouches[i].clientX; lastRight.y = e.changedTouches[i].clientY;
                        }
                    }
                });
                document.getElementById('touch-right').addEventListener('touchend', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === rightTouchId) {
                            rightTouchId = null;
                            if (!isDragging) interact(mobileActionMode === 'place');
                        }
                    }
                });
            }
        }

        function interact(isPlace) {
            let pos = camera.position.clone();
            let dir = new THREE.Vector3();
            camera.getWorldDirection(dir); dir.normalize();

            let step = 0.1, dist = 0, lastPos = null;
            while (dist < 6) { 
                pos.addScaledVector(dir, step); dist += step;
                let bx = Math.round(pos.x), by = Math.round(pos.y), bz = Math.round(pos.z);
                let key = `${bx},${by},${bz}`;

                if (blocks.has(key)) {
                    if (isPlace && lastPos) addBlock(lastPos.x, lastPos.y, lastPos.z, currentBlockType, true);
                    else if (!isPlace) removeBlock(bx, by, bz, true);
                    return;
                }
                lastPos = { x: bx, y: by, z: bz };
            }
        }

        function checkCollisions(pos) {
            let minX = Math.floor(pos.x - 0.3), maxX = Math.ceil(pos.x + 0.3);
            let minY = Math.floor(pos.y - 1.6), maxY = Math.ceil(pos.y + 0.2); 
            let minZ = Math.floor(pos.z - 0.3), maxZ = Math.ceil(pos.z + 0.3);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (blocks.has(`${x},${y},${z}`)) return true;
                    }
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPointerLocked || isMobile) {
                const time = performance.now();
                let delta = Math.min((time - prevTime) / 1000, 0.1); 

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 3.0 * delta; 

                let dir = new THREE.Vector3(moveState.right, 0, -moveState.forward);
                dir.applyQuaternion(camera.quaternion);
                dir.y = 0; dir.normalize();

                const speed = 40.0;
                let speedMult = Math.max(Math.abs(moveState.forward), Math.abs(moveState.right));
                if (speedMult === 0 && !isMobile) speedMult = (moveState.forward !== 0 || moveState.right !== 0) ? 1 : 0; 

                if (dir.lengthSq() > 0.01) {
                    velocity.x += dir.x * speed * speedMult * delta;
                    velocity.z += dir.z * speed * speedMult * delta;
                }

                let pos = camera.position;
                pos.x += velocity.x * delta;
                if (checkCollisions(pos)) pos.x -= velocity.x * delta;

                pos.z += velocity.z * delta;
                if (checkCollisions(pos)) pos.z -= velocity.z * delta;

                pos.y += velocity.y * delta;
                if (checkCollisions(pos)) {
                    pos.y -= velocity.y * delta;
                    if (velocity.y < 0) canJump = true;
                    velocity.y = 0;
                } else {
                    canJump = false;
                }

                if (pos.y < -30) { pos.set(8, 30, 8); velocity.set(0,0,0); }

                updateChunks();
                prevTime = time;
                renderer.render(scene, camera);
            } else {
                prevTime = performance.now();
            }
        }

        window.addEventListener('resize', () => {
            if(camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // ==========================================
        // UI И СЕТЬ (МУЛЬТИПЛЕЕР)
        // ==========================================
        function selectBlock(type) {
            currentBlockType = type;
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
            document.getElementById(`slot-${type}`).classList.add('active');
        }

        function startGameUI() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';
            initEngine();
            
            // Отправляем свои координаты только если мы подключены к сети
            setInterval(() => {
                if (camera && peer && !peer.disconnected) {
                    sendNetData({
                        type: 'pos', id: peer.id,
                        x: camera.position.x, y: camera.position.y, z: camera.position.z,
                        ry: euler.y
                    });
                }
            }, 50);
        }

        function updateOtherPlayer(id, x, y, z, ry) {
            if (!otherPlayers.has(id)) {
                let mat = new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff });
                let mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), mat);
                scene.add(mesh);
                otherPlayers.set(id, mesh);
            }
            let p = otherPlayers.get(id);
            p.position.set(x, y - 0.9, z);
            p.rotation.y = ry;
        }

        function sendNetData(data) {
            connections.forEach(conn => { if (conn && conn.open) conn.send(data); });
        }

        function handleNetData(data, senderConn) {
            if (data.type === 'pos') {
                updateOtherPlayer(data.id, data.x, data.y, data.z, data.ry);
                if (isHost) connections.forEach(c => { if (c !== senderConn && c.open) c.send(data); });
            } else if (data.type === 'block') {
                if (data.action === 'place') {
                    worldMods[`${data.x},${data.y},${data.z}`] = { action: 'place', type: data.blockType };
                    addBlock(data.x, data.y, data.z, data.blockType, false);
                }
                if (data.action === 'break') {
                    worldMods[`${data.x},${data.y},${data.z}`] = { action: 'break' };
                    removeBlock(data.x, data.y, data.z, false);
                }
                if (isHost) connections.forEach(c => { if (c !== senderConn && c.open) c.send(data); });
            } else if (data.type === 'sync_world') {
                // Загрузка мира при подключении
                worldMods = data.changes;
                for (let key in worldMods) {
                    let [x, y, z] = key.split(',').map(Number);
                    if (worldMods[key].action === 'place') addBlock(x, y, z, worldMods[key].type, false);
                    if (worldMods[key].action === 'break') removeBlock(x, y, z, false);
                }
            }
        }

        function setupConnectionEvents(conn) {
            conn.on('open', () => {
                document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`;
                // Если мы хост, отправляем новому игроку все измененные блоки
                if (isHost) conn.send({ type: 'sync_world', changes: worldMods });
            });
            conn.on('data', (data) => handleNetData(data, conn));
            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                if (otherPlayers.has(conn.peer)) {
                    scene.remove(otherPlayers.get(conn.peer));
                    otherPlayers.delete(conn.peer);
                }
                document.getElementById('players-info').innerText = `Игроков: ${connections.length + 1}`;
            });
        }

        // --- Кнопки главного меню ---
        const statusDiv = document.getElementById('status');
        
        document.getElementById('btn-single').addEventListener('click', startGameUI);

        document.getElementById('btn-host').addEventListener('click', () => {
            statusDiv.innerText = 'Создание сервера...';
            peer = new Peer();
            peer.on('open', (id) => {
                isHost = true;
                // Показываем ID в игре
                document.getElementById('server-id-display').style.display = 'block';
                document.getElementById('sid-text').innerText = id;
                startGameUI(); // Сразу кидаем хоста в игру
            });
            peer.on('connection', (conn) => {
                connections.push(conn);
                setupConnectionEvents(conn);
            });
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const hostId = document.getElementById('join-id').value.trim();
            if (!hostId) { statusDiv.innerText = 'Введи ID сервера!'; return; }
            statusDiv.innerText = 'Подключение...';
            
            peer = new Peer();
            peer.on('open', (id) => {
                const conn = peer.connect(hostId);
                conn.on('open', () => {
                    connections.push(conn);
                    setupConnectionEvents(conn);
                    startGameUI();
                });
                conn.on('error', () => { statusDiv.innerText = 'Ошибка подключения!'; });
            });
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
